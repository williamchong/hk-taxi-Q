# Hong Kong — every city specific the pipeline is allowed to know.
#
# Nothing in etl/pipeline/ may hardcode any value from this file (CLAUDE.md hard
# rule 3). Facts here are verified in docs/DATA_SOURCES.md; correct them there
# first if one turns out to be wrong.
schema_version: 1
id: hong_kong
name: Hong Kong

crs:
  # Every source dataset is published in the HK1980 Grid System — a Transverse
  # Mercator projection in metres. All pipeline geometry stays in it until the
  # final conversion to game space.
  projected: EPSG:2326

  # The datum the region bounds below are expressed in. This MUST be stated,
  # never assumed.
  #
  # HK1980 and WGS84 differ by ~304 m on the ground in Hong Kong — measurably,
  # not theoretically: the grid's own natural origin sits at 114-10-42.80 E,
  # 22-18-43.68 N *on HK1980*, and feeding those same digits in as WGS84 lands
  # 304 m away. That is a fifth of the width of the Wan Chai region.
  #
  # The bounds below were read off a consumer web map, which serves WGS84.
  geodetic: EPSG:4326

# Road Network v2 carries no Z ordinate. Its ELEVATION attribute is an ordinal
# grade-separation level — the GIS equivalent of OSM's `layer` tag — so deck
# heights are ours to author. Verified present: 0 (86.5%), 1 (2.0%), 2 (11.5%).
# Negative levels are plausible for tunnels but were not observed; -1 is mapped
# so that hitting one is a routing question rather than a crash.
elevation_levels:
  -1: -8.0
  0: 0.0
  1: 6.0
  2: 12.0

# Whole-territory extent, and the anchor for the shared city-space frame that
# regions are positioned in (Q10). Regions keep their own local origins so the
# geometry the player drives through stays near zero; `city_offset` is what
# places one region relative to another.
#
# ⚠️ THESE FOUR NUMBERS MUST NOT CHANGE once a city.json has shipped. Every
# region's offset is measured from them, so moving them silently relocates every
# region that was published against the old value. They are deliberately
# generous — Hong Kong spans roughly 113.835-114.441 E, 22.153-22.562 N, and the
# padding here is free — precisely so a later region never forces a change.
#
# Declared, not derived from the regions below, for the same reason: a frame
# computed from "the regions that exist so far" moves every time one is added.
bounds:
  west: 113.80
  east: 114.45
  south: 22.13
  north: 22.58

regions:
  wan_chai:
    name: Wan Chai to Causeway Bay
    # North-shore corridor. Natural map edges on all four sides: Victoria
    # Harbour north, the Mid-Levels escarpment south, Admiralty west,
    # Victoria Park east. Roughly 1.65 km x 0.9 km.
    bounds:
      west: 114.172
      east: 114.188
      south: 22.276
      north: 22.284
    tile_size_m: 150.0

# Direct static URLs, discovered via the data.gov.hk CKAN API. Verified to
# resolve on 2026-07-29; sizes re-checked 2026-07-30.
#
# Note the redundancy: RdNet_IRNP.gdb.zip is 17 MB and contains every layer,
# while the per-layer GML conversions of the same content total 539 MB
# (CENTERLINE.gml alone is 486 MB). Both are listed because P1-3 has not yet
# chosen a reader; drop whichever it does not use. See PROGRESS.md, Q9.
sources:
  road_network_gdb: https://static.data.gov.hk/td/road-network-v2/RdNet_IRNP.gdb.zip
  road_centrelines: https://static.data.gov.hk/td/road-network-v2/CENTERLINE.gml
  road_centrelines_schema: https://static.data.gov.hk/td/road-network-v2/CENTERLINE.gfs
  road_intersections: https://static.data.gov.hk/td/road-network-v2/INTERSECTION.gml
  road_bus_only_lanes: https://static.data.gov.hk/td/road-network-v2/BUS_ONLY_LANE.gml
  road_roundabouts: https://static.data.gov.hk/td/road-network-v2/ROUNDABOUT.gml
  road_prohibitions: https://static.data.gov.hk/td/road-network-v2/PROHIBITION.gml
  road_data_dictionary: https://static.data.gov.hk/td/road-network-v2/dataspec/rdnet_dataspec.zip

# Buildings ship as one ~44 MB glTF zip per 1:1000 map sheet, 3,456 sheets for
# the territory, with no single bulk URL. The CSDI portal's `file-api` serves
# the *sheet index* — a polygon per sheet carrying that sheet's download URLs —
# and that index is what makes the dataset scriptable. Verified 2026-07-30: the
# endpoint returns bytes identical (SHA-256) to the portal's manual download.
#
# The `Format_*` URLs in the index embed a shared public API key. It is never
# copied here: fetch.py reads it from the index at run time, so a rotated key
# costs nothing and no key ever reaches the repo. See DATA_SOURCES.md.
tiled_sources:
  buildings:
    index_url: https://portal.csdi.gov.hk/csdi-webpage/file-api?dataset_id=landsd_rcd_1742809441342_98380&format=geojson&layer_name=Nontextured_models
    # GeoJSON with `crs: null` is CRS84 per RFC 7946 — WGS84 lon/lat. Confirmed
    # against real building positions, not assumed; see DATA_SOURCES.md.
    index_crs: EPSG:4326
    id_property: SHEETNO
    url_property: Format_glTF
    revision_property: REVISIONDATE

# How P1-2 turns the source massing into vertex-coloured tiles. Every number
# here is art direction, not pipeline logic — see docs/ART_DESIGN.md, which is
# the document to change first if a colour looks wrong.
buildings:
  # Sub-directories inside a sheet zip to read. TERRAIN(TB) is deliberately
  # absent: it is textured, and the building stage emits no textures.
  classes:
    - BUILDING
    - INFRASTRUCTURE

  # Flat colour for a class, overriding the height bands. Elevated road
  # structures are concrete whatever their height, and banding a flyover deck by
  # height would tint it like the tower it happens to be as tall as.
  class_colours:
    INFRASTRUCTURE: "#9d9a93"

  # Otherwise coloured by the building's own height above its base. The ramp
  # runs warm-and-darker for the low pre-war and post-war stock to cool-and-
  # paler for curtain-walled towers, which is how the Wan Chai skyline actually
  # reads: old grain at street level, new glass above it.
  height_bands:
    - up_to_m: 12.0     # shophouses, podiums, market blocks
      colour: "#c9b79a"
    - up_to_m: 30.0     # walk-up tenements
      colour: "#d3c8b4"
    - up_to_m: 60.0     # 1970s-80s residential
      colour: "#cfcec2"
    - up_to_m: 120.0    # modern residential towers
      colour: "#c7cdc8"
    - up_to_m: .inf     # commercial towers
      colour: "#bfc6c6"

  # Per-building brightness variation, seeded from the building id so it is
  # stable across runs. Without it a height band renders as one flat mass and
  # the block reads as a single object rather than many buildings.
  colour_jitter: 0.06

  # Vertex-clustering cell size per LOD tier, in metres. 0.0 is an exact weld —
  # lossless, and worth doing because the source repeats every vertex per
  # triangle. See docs/ART_DESIGN.md "LOD policy" for the switch distances.
  lod_cell_sizes_m: [0.0, 1.5, 4.0]
