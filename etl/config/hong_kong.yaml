# Hong Kong — every tuning value and publisher vocabulary the pipeline reads.
#
# This file and `pipeline/hongkong.py` are the two homes a Hong Kong fact may
# have, and a value lives in exactly one of them (CLAUDE.md hard rule 3, `Q100`):
# what could be tuned or is a publisher's vocabulary is here; what *is* the city
# — the CRS pair, which side it drives on, the branch sign codes — is there.
# Facts here are verified in docs/DATA_SOURCES.md; correct them there first if
# one turns out to be wrong.
schema_version: 4

# The palette rule (`Q33`). **Every authored colour in this file is a real
# material's diffuse albedo multiplied by this one number**, and `config.py`'s
# `_check_exposure` refuses to load a colour that is not.
#
# The split is the same one `facade_hue.strength` already makes, and for the
# same reason. A `reflectance:` is *evidence* — a published albedo for asphalt
# or concrete or soil, portable to the second city unchanged, and arguable
# against a source rather than against taste. This anchor is *art direction* —
# one number carrying the sun, the latitude and the mood, and the only thing
# that changes when a city wants to look like a different time of day.
#
# ⚠️ **It exists because the palette had no external referent and drifted.**
# Colours were placed by eye against each other, so the only question anyone
# could ask was whether they looked consistent with one another — and a set
# judged that way always indicts its most extreme member. It did: the asphalt
# was 24 L* below everything else and was read as the defect, when dividing by
# this anchor showed it claiming 8.2% albedo, dead centre of real aged asphalt's
# 7-12%. The kerb was claiming 58.9% for concrete that is 20-30%.
#
# 0.520 is not chosen here — it is measured, and it is the *only* value in this
# block with a graded frame behind it. `235aa4f` scaled the bands and both class
# colours by it in linear light and shipped the result: frame L* 73.0 -> 62.7,
# gain 0.85, responding share 66.4%. That commit is also what motivated the rule,
# because it applied this factor to the colours in `buildings:` and not to the
# two in `roads:` — not by argument, but because `roads:` was not in its diff.
#
# ⚠️ **The reflectances the five facade materials declare are back-derived from
# that commit, not cited.** They come out at 49-62%, which is the top of what
# painted render and ceramic tile actually do. That is the one soft number in the
# rule, and it is recorded as a reflectance precisely so it can be argued with; if
# it is wrong, this anchor is wrong with it and every other colour moves. Do not
# take them as evidence for a third city.
exposure_anchor: 0.520

# Every colour this city ships, by name.
#
# ⚠️ **No colour may be authored anywhere else in this file.** `buildings:` and
# `roads:` reference these names; `_check_exposure` reads this table and only
# this table. A colour written somewhere else would ship unchecked — which is
# not hypothetical, it is precisely what `235aa4f` did.
#
# ⚠️ **Top-level rather than inside `buildings:`, deliberately.** Both sections
# draw from it. Nesting it under either would make the other reach across for its
# colours, rebuilding the exact asymmetry that let one section be re-exposed and
# the other missed.
#
# ⚠️ **A material is a claim about a surface, not about a kind of building
# (`Q34`).** `colour` and `reflectance` used to be fields on `height_bands`,
# which made the *shape* of this file assert that material is a function of
# height. It is not: measured on the 2,171-building photo survey, height explains
# **0.9%** of facade `L*` once log pixel count is controlled, and the best
# geometric key of any kind reaches 1.4%. Where each material is *used* is
# decided in `buildings:` and `roads:` below; what it *is* is decided here.
#
# `source:` is required and deliberately not validated. The point is that
# somebody had to type an answer, including "back-derived, not cited" where that
# is the truth — an unsourced albedo is how this palette drifted before `Q33`.
materials:
  # The five facade colours, warm-and-darker through to cool-and-paler.
  #
  # ⚠️ **These five are unchanged by the palette rule, and their reflectances are
  # therefore back-derived rather than cited** — each is simply what the shipped
  # colour claims once the anchor is divided out. The rule is calibrated *on*
  # them, so it cannot also check them; they are the one place in this file where
  # the number describes the colour instead of the colour answering to the
  # number. The tell is that they read 49-62%, at the top of what painted render
  # and ceramic tile do. Recorded anyway, because a soft number stated is
  # arguable and a soft number implied is not.
  #
  # ⚠️ **The level they sit at is the whole city's, and it was measured — see
  # docs/DECISIONS.md, Q27 and Q33.** These five were 19 L*
  # lighter and the city read white from every camera; darkening them moved the
  # rendered frame 10.3 L*, where every other lever tried bought under 1. Each
  # colour is the old one scaled by 0.520 in linear light, so the warm-to-cool
  # ramp they were authored for survived and only the level moved.
  #
  # ⚠️ **Five names for what is really one material family**, at five lightnesses.
  # That is a weaker claim than the height bands used to make and it is still a
  # claim; it is stated here rather than hidden in the assignment. Do not rename
  # the last of them to anything glazed: 55.2% contradicts curtain-wall glass's
  # 8-15% diffuse albedo, which is the trap `Q34` records at length.
  render_warm:
    colour: "#968872"
    reflectance: 48.7
    source: "back-derived from 235aa4f, not cited; painted render is 30-60%"
  render_pale:
    colour: "#9d9586"
    reflectance: 58.4
    source: "back-derived from 235aa4f, not cited; painted render is 30-60%"
  tile_neutral:
    colour: "#9a9a90"
    reflectance: 61.5
    source: "back-derived from 235aa4f, not cited; ceramic facade tile is 45-65%"
  render_cool:
    colour: "#949995"
    reflectance: 60.1
    source: "back-derived from 235aa4f, not cited; painted render is 30-60%"
  panel_grey:
    colour: "#8e9393"
    reflectance: 55.2
    source: "back-derived from 235aa4f, not cited; light grey panel is 45-60%"

  # Weathered concrete at the sooty end: viaduct soffits and pier faces carry
  # decades of traffic film.
  #
  # ⚠️ **Re-placed by the palette rule (`Q33`), which moved it down 7.7 L*.**
  # Scaling by the anchor had kept it in step with the facades but preserved what
  # it was in step *from*, and what it was placed by was the eye.
  concrete_sooty:
    colour: "#615f5a"
    reflectance: 22.0
    source: "weathered concrete, sooty end of 20-30% for clean concrete"

  # The region's ground. Reclamation, and what the player sees on it is paving,
  # plaza, apron and promenade — the carriageway is drawn separately from
  # `roads.glb`, so this colours everything *between* the roads. Not the fill
  # underneath them, which is what the old `fill_dry` name and its "dry soil and
  # urban fill" source were describing. ⚠️ **`Q36` renamed it for that reason:
  # the comment here already said "fill and hardstanding" while the material
  # claimed soil, and `Q34`'s rule is that a material is a claim about a
  # *surface*.** Reflectance did not move, so nothing about the level changed —
  # 20.0% also orders correctly against the concrete already in this table
  # (`concrete_kerb` 25.0, `concrete_sooty` 22.0), because a pavement is walked
  # on, driven over and stained and is the dirtiest concrete in the city.
  #
  # The colour was originally warm concrete placed by what it had to sit between:
  # clear of the kerb so the 0.15 m riser and 0.5 m lip still read as an edge
  # rather than dissolving into the pavement, and darker than the lowest facade
  # band so low blocks read as standing *on* the ground. ⚠️ **That placement is
  # history: since `Q33` the level is set by the material, not by the
  # neighbours.** Both relationships still hold and neither is what produces the
  # number any more — the kerb it is "clear of" moved 19.4 L* in the same change,
  # which is exactly the fragility of placing a colour against another colour
  # rather than against a referent. Divided back out, this was claiming 39.6%
  # albedo where dry soil and urban fill are 15-25%, which is the reading the
  # art-direction audit gave it independently: the reclamation rendered as sand
  # rather than as ground. `Q33` moved it down 13.9 L*.
  #
  # ⚠️ **`Q18` doubled the chroma to 14.0 and `Q36` took it back out. Read this
  # before raising it again.** The knee below is real and its numbers still hold;
  # what did not hold is the conclusion drawn from them. `Q18` measured that the
  # ground "read dead" at an *unchanged* L* of 52.6 and fixed it with hue: albedo
  # C* 6.81 arrives at 1.95, 11.0 at 2.93, 14.0 at 6.25, 31.96 at 28.42, so the
  # old #837d72 rendered neutral and an open expanse read as white plaster. 18.0
  # was built and rejected on the eye as beach sand.
  #
  # ⚠️ **That was compensation for a lightness problem, and `Q33` then fixed the
  # lightness without anyone removing the compensation.** The two changes were
  # never graded together. Measured on `art_ground`, same camera, same box:
  # `Q18`'s failure state rendered at L* 67.2 / C* 6.48, and this material at
  # C* 5.93 renders at **L* 49.2 / C* 3.53** — *less* chroma than the state `Q18`
  # rejected, and it reads as a concrete apron rather than as plaster, because
  # 18 L* came out of the render in between. Nothing survives of "the ground needs
  # chroma to read"; what it needed was to stop being pale.
  #
  # ⚠️ **There is a null, and it is not at the greyest hex.** Rendered chroma is
  # roughly |warm albedo - blue illuminant|, so it bottoms out where the two
  # cancel and climbs again past it: authored C* 5.93 renders at 3.53, while
  # authored C* 4.47 — less colour in the file — renders at **5.04**, pulled cool.
  # Authoring a little warmth is what cancels the sky, which is also what real
  # concrete does under one. Do not "simplify" this toward a neutral grey.
  #
  # ⚠️ **The illuminant is blue, which is why this colour's chroma was never the
  # outlier it looked like** — it rendered at 6.71 against the asphalt's 7.05.
  # `asphalt_aged` is the frame's grey card and measures the rig at ~7 C* of blue
  # added to everything; the ambient behind that is `Q31`'s, not this table's.
  #
  # ⚠️ **The knee sits at C* 11-14 for one viewpoint, and it is a property of the
  # viewpoint rather than of the renderer** — do not reuse the number. Measured
  # again on the region's only other terrain — the south-east hillside, which
  # rises to 50.2 m where the rest is flat reclamation at a median 3.96 m — the
  # same 6.81 -> 14.0 change buys C* 1.95 -> 6.25 close in, 3.33 -> 5.09 at
  # ~200 m, and nothing at all at ~350 m through fog. Chroma also survives better
  # where the ground renders darker: under L* 55 it holds C* 8-10, at L* 65-75
  # only 3-5. Distance and surface brightness both move the knee. Distant ground
  # washing toward fog is correct atmospheric perspective, not a defect.
  #
  # ⚠️ **One material paints the hillside too, and splitting it on elevation was
  # probed and refused — do not re-propose it.** The story was that a Hong Kong
  # hillside is green because it is too steep to build on, so high ground wants a
  # vegetated material. In *this* region the opposite holds where it matters:
  # terrain above 10 m is 9.77% of the surface, renders **0.000%** of all six
  # fixed viewpoints, and the one road that climbs it looks out over ground that
  # is **97.5% flat** — a paved terrace with towers on it, which is what this
  # material already says. Slope-only fails too, on interleaved speckle that
  # `collapse` preserves because it takes a representative colour rather than an
  # average. Vegetation, if wanted, is a vector land-use join. `Q36`.
  #
  # ⚠️ **The knee is measured for *ground* and must not be assumed for the
  # facades.** Ground is up-facing and renders bright, which is what eats chroma;
  # a facade is vertical, darker, and takes facade_hue's strength on top. Most of
  # this palette does sit under C* 11, which is worth someone's attention, but it
  # is not evidence until it is measured on the surface in question.
  concrete_paving:
    colour: "#5f5a51"
    reflectance: 20.0
    source: "weathered concrete, grubby end of 20-30%; paving is walked, driven and stained"

  # ⚠️ **These two are the colours the palette rule was written for.** They used
  # to live in `RoadSurface` where the rest of the palette lived in
  # `BuildingStyle`, and that is the whole reason `235aa4f` re-exposed every other
  # colour in this file and left these behind — the section was not in the diff.
  # The kerb then became the brightest surface in the city *by not moving* while
  # everything around it dropped 19 L*, and nothing flagged it, because the commit
  # reasoned *from* the kerb as a fixed landmark. They are in this table now, so
  # there is no longer a second place to forget.
  #
  # The rule reversed the obvious diagnosis. Against its neighbours the asphalt
  # looked like the outlier at 24.5 L*, 24 below the pack; against published
  # albedo it was the one colour already right, and it moved 2.7 L*. The kerb
  # moved 19.4 and the ratio between them lands at 2.5:1, which is what concrete
  # against asphalt actually is — it was 6.6:1. That leaves 15.6 L* of separation,
  # so the 0.15 m riser still reads as an edge rather than dissolving into the
  # carriageway, which is the job kerb contrast has here.
  asphalt_aged:
    colour: "#42403d"
    reflectance: 10.0
    source: "aged urban asphalt, mid-range of 7-12%; fresh-laid is ~4% and weathers up"
  # Distinct from concrete_sooty at 22.0, and deliberately so: a cast kerb is not
  # a viaduct soffit. Kerbs are cast rough, kept wet in summer and stained at the
  # channel, so the clean end does not apply to them either.
  concrete_kerb:
    colour: "#68655c"
    reflectance: 25.0
    source: "weathered concrete, mid-range of 20-30%"

  # HKCEC's repaint surfaces (`P3-6`): the four colours `source_paint` puts on
  # the extracted Phase 2 source mesh, read off the Expo Drive East street
  # views (2024) — the elevation is *pale* panels carrying thin dark ribbon
  # glazing, under a roof *darker* than the wall. `tools/make_landmark.py`
  # keeps its own Central Plaza palette; these entered this table when the
  # HKCEC generator retired, because a colour a *pipeline* stage ships must
  # live where `_check_exposure` can see it.
  panel_pale:
    colour: "#868077"
    reflectance: 42.0
    source: "pale precast and granite curtain panels, 35-45%"
  roof_grey:
    colour: "#5a6063"
    reflectance: 22.0
    source: "pearl-grey coated aluminium re-roof, 18-28%"
  curtain_glass:
    colour: "#3d4853"
    reflectance: 12.0
    source: "curtain-wall glass, 8-15% diffuse — the trap Q34 records: never lighter"
  concrete_pale:
    colour: "#726e66"
    reflectance: 30.0
    source: "clean concrete and granite podium cladding, 20-35%"

  # The tram rail (`P3-14`, `Q58`). The brightest thing this city puts on a road
  # surface, and that is the material rather than a preference: what the player
  # sees of a rail set flush in the carriageway is the *head*, kept polished by
  # the traffic running on it. The body is dark and oxidised, and is not drawn.
  #
  # ⚠️ **It sits above the road palette's band on purpose, and that is the one
  # thing to look at if the tramway reads wrong.** `Q31`'s ratio argument places
  # kerb against asphalt at 2.5:1; steel against asphalt here is 3.5:1. A rail
  # that reads as a bright line at a low sun is correct; a rail that reads as
  # emissive is `road_markings.gdshader`'s clipped-white failure in a new place,
  # and the dial for it is `tuning/tramway.tres`, not this number.
  steel_rail:
    colour: "#72777b"
    reflectance: 35.0
    source: "steel rail head polished by use; bare and weathered steel is 30-50%"

  # A lamp column (`P3-26`). Hot-dip galvanised steel that has been weathering in
  # a marine atmosphere for years: fresh galvanising is bright, 50-60%, and dulls
  # hard as the spangle goes matt grey.
  #
  # ⚠️ **Below `steel_rail`'s 35 on purpose, and the ordering is the argument.**
  # That one is a rail *head*, kept polished by the traffic running over it — the
  # brightest steel in the city. A column is the dullest. Getting these two the
  # same way round matters more than either absolute value, because it is the
  # part a reviewer can check by looking.
  #
  # 🔴 **Dead neutral, and that is `Q61` rather than taste.** The railings shipped
  # an authored *green* bias read off nothing and read white and strange; the
  # correction was to a neutral albedo, because the sky supplies the cool cast on
  # its own — measured on the `street` frame at B-R **+11.5** once blue is
  # authored in against **+5.7** from a neutral. Do not tint this toward zinc.
  galvanised_steel:
    colour: "#6b6b6b"
    reflectance: 28.0
    source: "weathered hot-dip galvanised steel; fresh is 50-60% and dulls to 25-35%"

# Road Network v2 carries no Z ordinate. Its ELEVATION attribute is an ordinal
# grade-separation level — the GIS equivalent of OSM's `layer` tag — so deck
# heights are ours to author.
#
# Measured across the Wan Chai region by P1-3: 0 (736 edges), 1 (45), -1 (15).
# Level -1 is the Cross-Harbour Tunnel and the Central-Wan Chai Bypass, and it
# confirms the defensive mapping that was added before any negative was seen.
#
# These are offsets from ground level, not absolute heights — see `roads.ground`
# and Q11. Level 0 is 0.0 by definition: the ground *is* the ground.
elevation_levels:
  -1: -8.0
  0: 0.0
  1: 6.0
  2: 12.0

# Whole-territory extent, and the anchor for the shared city-space frame that
# regions are positioned in (Q10). Regions keep their own local origins so the
# geometry the player drives through stays near zero; `city_offset` is what
# places one region relative to another.
#
# ⚠️ THESE FOUR NUMBERS MUST NOT CHANGE once a city.json has shipped. Every
# region's offset is measured from them, so moving them silently relocates every
# region that was published against the old value. They are deliberately
# generous — Hong Kong spans roughly 113.835-114.441 E, 22.153-22.562 N, and the
# padding here is free — precisely so a later region never forces a change.
#
# Declared, not derived from the regions below, for the same reason: a frame
# computed from "the regions that exist so far" moves every time one is added.
bounds:
  west: 113.80
  east: 114.45
  south: 22.13
  north: 22.58

regions:
  wan_chai:
    name: Wan Chai to Causeway Bay
    # North-shore corridor. Natural map edges on all four sides: Victoria
    # Harbour north, the Mid-Levels escarpment south, Admiralty west,
    # Victoria Park east. Roughly 1.65 km x 0.9 km.
    bounds:
      west: 114.172
      east: 114.188
      south: 22.276
      north: 22.284
    tile_size_m: 150.0

# Direct static URLs, discovered via the data.gov.hk CKAN API. Verified to
# resolve on 2026-07-29; sizes re-checked 2026-07-30.
#
# The geodatabase is 17 MB and holds all seventeen layers. The publisher also
# offers each layer as GML, totalling 539 MB for the same content — CENTERLINE
# alone is 486 MB, because GML spends most of its bytes on XML tags. Those were
# listed here until P1-3 chose a reader; it reads the geodatabase, so they are
# gone and a clean fetch is 522 MB lighter. Resolves Q9.
sources:
  road_network_gdb: https://static.data.gov.hk/td/road-network-v2/RdNet_IRNP.gdb.zip
  # Not read by the pipeline. It is the published data specification, and every
  # field mapping under `roads:` below is verified against it.
  road_data_dictionary: https://static.data.gov.hk/td/road-network-v2/dataspec/rdnet_dataspec.zip

  # Ordinary build input since `P3-12`/`P3-14`: seven blocks read it — `roads`
  # (via `carriageway_survey`), `arrows`, `signs`, `boxjunctions`, `road_marks`,
  # `railings` — and `tools/kerbside_source_audit.py` still runs `Q56`'s audit
  # over its restriction layer (the audit's second-source property rests on the
  # *layer*, not on the file being otherwise unread). Traffic Aids Drawings 2nd
  # generation: the Transport Department's drawing set as spatial features, 51
  # layers, monthly. ⚠️ **218 MB, the largest single fixed-URL source here**,
  # against the road network's 17 MB, because it carries the whole territory's
  # markings, signs, railings and poles.
  #
  # ⚠️ The 1st-generation dataset (`tis_8`) is being withdrawn and its only
  # remaining resource is a CSV pointing here. Do not go back to it.
  traffic_aids_drawings_gdb: https://static.data.gov.hk/td/traffic-aids-drawings-v2/dTAD_IRNP.gdb.zip
  # The drawings' own data specification, and the index plan that defines every
  # RM marking code. `audit.kinds` above is verified against it — and it is
  # build input too since `P3-20`: `signs.text_source` names it, and
  # `sign_sheets.py`/`sign_text.py` crop the lettering cells out of its PDFs.
  traffic_aids_data_dictionary: https://static.data.gov.hk/td/traffic-aids-drawings-v2/dataspec/tadrawings_dataspec.zip

  # The two fare-node datasets, both whole-territory point GeoJSON and both
  # small — 518 and 275 features, 343 KB and 192 KB. data.gov.hk lists only a
  # portal link for each, so these URLs come from the CSDI file-api the
  # buildings index also uses. Unlike that one they carry no API key and need
  # no `layer_name`. Verified to resolve on 2026-07-31.
  taxi_stands: https://portal.csdi.gov.hk/csdi-webpage/file-api?dataset_id=td_rcd_1697081907714_17556&format=geojson
  taxi_pudo: https://portal.csdi.gov.hk/csdi-webpage/file-api?dataset_id=td_rcd_1697082382328_14459&format=geojson

  # Tram stops (`P3-14`). Same CSDI `file-api` pattern as the two above, no API
  # key, no `layer_name` — 117 features territory-wide and **19 inside the
  # region**, surveyed by `Q57` and fetched by `Q58`. Tiny beside the 218 MB
  # audit source above.
  #
  # ⚠️ These are **not** fare nodes in the taxi sense and are published as the
  # `poi` kind the contract has always reserved. A tram stop is somewhere a tram
  # stops; letting a player hail a fare at one would be wrong in the way
  # `docs/GAME_DESIGN.md` cares about, so its category sets `pickup: false` and
  # `dropoff: false` explicitly — `FareCategory` defaults both to true.
  tram_stops: https://portal.csdi.gov.hk/csdi-webpage/file-api?dataset_id=td_rcd_1638875413253_59498&format=geojson

# Buildings ship as one ~44 MB glTF zip per 1:1000 map sheet, 3,456 sheets for
# the territory, with no single bulk URL. The CSDI portal's `file-api` serves
# the *sheet index* — a polygon per sheet carrying that sheet's download URLs —
# and that index is what makes the dataset scriptable. Verified 2026-07-30: the
# endpoint returns bytes identical (SHA-256) to the portal's manual download.
#
# The `Format_*` URLs in the index embed a shared public API key. It is never
# copied here: fetch.py reads it from the index at run time, so a rotated key
# costs nothing and no key ever reaches the repo. See DATA_SOURCES.md.
# Datasets a publisher will only serve a page of records at a time (`Q94`).
# `fetch.download_paged` walks the template and assembles ONE file, so nothing
# downstream knows this source was paged.
paged_sources:
  # HyD's maintained pavement extents — the carriageway as an AREA, and the only
  # source in the estate that draws it that way. CSDI only, no DATA.GOV.HK
  # package. See DATA_SOURCES.md for the decoded FEAT_TYPE domain and the clip.
  #
  # 🔴 **Whole territory and not a bbox, deliberately.** Asking the service for
  # the Wan Chai envelope is one request and 3 MB against 22 and ~189 MB — and it
  # is refused, because `paged_sources` is per-CITY while an envelope is
  # per-REGION. A bbox here would either duplicate bounds that hard rule 3 keeps
  # in one place or need a per-region source block. The clip stays where it
  # already is: `bbox` at read time, out of this same file.
  #
  # ⚠️ `geometryPrecision=2` is centimetres in EPSG:2326, and it is a **41% cut**
  # to the payload (19.79 -> 11.71 MB a page) for no measurable loss: the three
  # STEWART ROAD edges read 10.500 / 16.720 / 16.660 m at both full precision and
  # rounded, to 0.000 m. The source's own agreement with iB1000 is 3-5 cm.
  #
  # ⚠️ `outSR=2326` so this lands in the projected CRS every other publisher is
  # already in and `expect_crs` passes untouched. The file-api's whole-territory
  # download is WGS84 GeoJSON at 317 MB and would need a reprojection path that
  # `gdb.read_layer` explicitly declines to have.
  #
  # ⚠️ `orderByFields=OBJECTID` because paging without a stable sort is undefined
  # — the server may return the same feature twice and never another.
  pavement_polygon:
    url: "https://portal.csdi.gov.hk/server/rest/services/common/hyd_rcd_1632210918434_60749/MapServer/0/query?where=1%3D1&outFields=FEAT_TYPE%2CLVL&returnGeometry=true&outSR=2326&geometryPrecision=2&orderByFields=OBJECTID&resultOffset={offset}&resultRecordCount={count}&f=geojson"
    # The service's own maxRecordCount. Asking for more is silently capped.
    page_size: 3000
    # 64,644 features territory-wide is 22 pages; the ceiling is slack enough to
    # survive the layer growing and tight enough to catch a server that ignores
    # `resultOffset` and hands back page one forever.
    max_pages: 60
    # 🔴 Load-bearing: `pyogrio` names a GeoJSON layer after the filename stem,
    # so this is what `carriageway_survey.edges[].layer` has to spell.
    filename: INV_PG.geojson

tiled_sources:
  buildings:
    index_url: https://portal.csdi.gov.hk/csdi-webpage/file-api?dataset_id=landsd_rcd_1742809441342_98380&format=geojson&layer_name=Nontextured_models
    # GeoJSON with `crs: null` is CRS84 per RFC 7946 — WGS84 lon/lat. Confirmed
    # against real building positions, not assumed; see DATA_SOURCES.md.
    index_crs: EPSG:4326
    id_property: SHEETNO
    url_property: Format_glTF
    revision_property: REVISIONDATE

  # iB1000 Digital Topographic Map — one FGDB zip per 1:1000 sheet, the same
  # six 11-SW-* sheets as the building models for Wan Chai (41.8–45.3 MB each,
  # 260 MB the region — Q47's accepted build-time cost). The per-sheet
  # `directDownload` URLs in this index are keyless and return plain 200s; the
  # ISO record's portal links 403 to scripted GET. See DATA_SOURCES.md "iB1000".
  # The download host also serves its TLS chain without the issuing
  # intermediate — hence `extra_cas` below.
  topography:
    index_url: https://portal.csdi.gov.hk/csdi-webpage/file-api?dataset_id=landsd_rcd_1637223748322_25497&format=geojson&layer_name=TileIndex
    index_crs: EPSG:4326
    id_property: SHEETNO
    url_property: FGDB
    revision_property: REVISIONDATE
    # The download URL's path is `/OpenData/directDownload` — the format lives
    # in the query string, so the URL offers no filename suffix to inherit.
    tile_suffix: .zip

# open.hkmapservice.gov.hk serves leaf + root but not the issuing
# intermediate. A browser chases the gap through the certificate's AIA URL;
# Python's OpenSSL does not, so without help the fetch fails
# CERTIFICATE_VERIFY_FAILED against a chain the default store does trust.
# The committed PEM is that intermediate — provenance and fingerprint in its
# header — loaded as an *additional* verify anchor: it must itself chain to
# the Hongkong Post root already in the default store, so verification is
# completed, never relaxed.
extra_cas:
  - certs/hongkong_post_ecert_ssl_ca_3-17.pem

# How P1-2 turns the source massing into vertex-coloured tiles. Every number
# here is art direction, not pipeline logic — see docs/ART_DESIGN.md, which is
# the document to change first if a colour looks wrong.
buildings:
  # Sub-directories inside a sheet zip holding massing to tile.
  classes:
    - BUILDING
    - INFRASTRUCTURE
    - TERRAIN(TB)

  # The ground. Named here rather than in the pipeline because the parenthesis
  # is a LandsD spelling, not a fact about terrain.
  #
  # It is in `classes` above since P3-10, so it is drawn as well as sampled —
  # roads.py reads it as a height field to decide how high every road sits, and
  # the tile stage draws the same geometry. The source ships it *textured*, 224
  # MB of JPEG against 43 MB of geometry, and the texture is read at build time
  # and never shipped: the tile output carries no textures, which is what keeps
  # a tile one draw call. `--terrain` still emits the textured version for
  # evaluation, and docs/ART_DESIGN.md records why we do not ship it.
  terrain_class: TERRAIN(TB)

  # The class holding elevated road structure, which `roads.deck` below samples
  # a flyover's height from. Named here for the same reason as terrain_class:
  # the spelling is the publisher's, not a fact about structure.
  #
  # Must be one of `classes` above, and that is the point rather than a
  # formality — P2-7 measures the ribbon against the *shipped* tiles, so a
  # carriageway laid on geometry only the sampler can see would be accurate
  # against nothing the player ever meets.
  structure_class: INFRASTRUCTURE

  # A flat material for a class, overriding the height bands. Elevated road
  # structures are concrete whatever their height, and banding a flyover deck by
  # height would tint it like the tower it happens to be as tall as. The ground
  # has no height of its own to band by at all.
  #
  # ⚠️ **This is also what `surface_class` reads to decide what the window-band
  # shader may band** — a class with a flat material here is a thing whose colour
  # does not depend on how tall it is, which is exactly the set with no floors to
  # draw. Adding an entry here silently stops that class being banded.
  #
  # ⚠️ **Both materials take the same 0.520 anchor as the facades**, and for the
  # same reason: a facade-only anchor leaves the ground as the one bright plane in
  # the frame. That both are named from one table now is what keeps "the level
  # moved" from becoming "the palette was re-mixed" — there is one place to change
  # and it cannot be half-applied. What each colour *is*, and the whole argument
  # behind the ground's chroma, sits with it under `materials:` at the top.
  class_materials:
    INFRASTRUCTURE: concrete_sooty
    TERRAIN(TB): concrete_paving

  # Jitter for a class that must not vary like the rest, overriding
  # colour_jitter below.
  #
  # The ground takes none. Jitter is seeded per *source mesh*, which for a
  # building is one building — the variation is what stops a height band reading
  # as a single mass. Terrain arrives as a handful of sheet-sized meshes, so the
  # same rule would paint the region in six shades with the seams landing on the
  # publisher's sheet boundaries. Ground wants the opposite of what buildings
  # want: one continuous surface.
  class_colour_jitter:
    TERRAIN(TB): 0.0

  # How far under its sampled height the drawn ground is placed, in metres.
  #
  # Not taste, and not optional: roads.py lays the level-0 carriageway at
  # `terrain + 0.0`, so ground and road are coplanar *by construction* and would
  # z-fight the length of all 98.6 km of network. The ground drops under the
  # kerb, whose riser and lip are what hide the seam — ART_DESIGN.md calls that
  # the lip's second job.
  #
  # Sized by measuring what still stands proud of the shipped carriageway rather
  # than by picking a number, on the precedent of roads.deck.clearance_m below:
  # `collapse` moves vertices to cluster means, so the ground that ships is not
  # the ground the sampler found. tools/ground_clearance.py grades it.
  ground_sink_m: 0.20

  # Cell sizes for a class that must not decimate like the rest, overriding
  # lod_cell_sizes_m below. Same reasoning as class_materials: infrastructure is
  # not a building and does not behave like one under either rule.
  #
  # A building is a big box, so a 1.5 m cell halves its triangles and leaves the
  # silhouette intact. An elevated road deck is *thin* — thinner than 1.5 m — so
  # the same cell clusters its top surface into its bottom one and the structure
  # folds into a warped sliver. P2-1 caught this on screen at Gloucester Road
  # and on the Hennessy Road footbridge; see docs/DECISIONS.md, P2-1.
  #
  # 0.5 m and 1.0 m rather than an outright exemption. Exempting infrastructure
  # entirely cost +20% and +57% on the two coarser tiers of the old three-tier
  # table, against +8.5% and +21% for these, and the deck survives either way —
  # it only has to beat its own thickness.
  #
  # The ground goes the other way, and for the mirror-image reason. A building's
  # cell is fine enough to keep a silhouette worth keeping; ground has no
  # silhouette, only extent, so the finest tier can be far coarser than a
  # building's without losing anything anyone can see. It is also the largest
  # single surface in the region, so the cell is what decides whether it costs
  # a rounding error or a fifth of the bundle.
  class_lod_cell_sizes_m:
    INFRASTRUCTURE: [0.5, 1.0]
    TERRAIN(TB): [4.0, 8.0]

  # Otherwise the material is picked by the building's own height above its base.
  # The ramp runs warm-and-darker for the low pre-war and post-war stock to
  # cool-and-paler for curtain-walled towers.
  #
  # ⚠️ **This is a lightness ramp, and since `Q34` that is *all* it claims.** It
  # used to carry the colours and their albedos inline, which made the shape of
  # this file assert that material is a function of height. The comments here used
  # to say the ramp is "how the Wan Chai skyline actually reads: old grain at
  # street level, new glass above it" — that reading was tested and it is not
  # supported. On the 2,171-building photo survey height explains **0.9%** of
  # facade `L*` once log pixel count is controlled and **0.7%** of `a*`; the best
  # geometric key of any kind, height and footprint together, reaches 1.4%.
  #
  # So the ramp stays as *art direction* — tall buildings paler is a defensible
  # look, and the frame-level measurement behind the anchor is real — but which
  # material a band names is a styling choice, not evidence about the city's
  # stock. Do not read a band's material as a claim about buildings of that
  # height. See `materials:` at the top of this file.
  material_assignment:
    # ⚠️ **The two branches are named for what is *known* about a building, not
    # for how the answer is computed.** An unsurveyed building is not a surveyed
    # one whose hue is being guessed at — it is a building the ramp answers for,
    # exactly as it always did.
    unsurveyed:
      by_height:
        - up_to_m: 12.0     # shophouses, podiums, market blocks
          material: render_warm
        - up_to_m: 30.0     # walk-up tenements
          material: render_pale
        - up_to_m: 60.0     # 1970s-80s residential
          material: tile_neutral
        - up_to_m: 120.0    # modern residential towers
          material: render_cool
        - up_to_m: .inf     # commercial towers
          material: panel_grey

    # Reached by having a measurement. Optional, and it must stay optional: this
    # whole block is dead on a clone that has never fetched the 4.9 GB survey,
    # and such a clone builds the city the ramp above describes.
    #
    # ⚠️ **What this buys is *lightness conditioned on hue*, and not more than
    # that.** `with_hue` replaces a* and b* immediately afterwards, so the drawn
    # material's own chroma never reaches the screen — only its L* survives. The
    # gain is that a building rendering cream gets an albedo plausible for cream
    # rather than one plausible for concrete. It is not "the material now agrees
    # with the colour"; that phrasing was used while designing this and it claims
    # more than the mechanism delivers.
    #
    # ⚠️ **It buys no spatial coherence either.** Neighbours draw independently,
    # and hue does not supply it: only 0.5% of hue variance lies between the
    # survey's six sheets. Real blocks share cladding and these will not. That is
    # the open half of `Q34`.
    #
    # ⚠️ **Every bin's weights are authored so its *expected* reflectance matches
    # what the height ramp already gave that same population.** The ramp hands
    # every hue bin almost the same mean — 57.6 inside the neutral ring, 57.8
    # warm, 55.7 cool — because height and hue are close to independent, which is
    # the whole finding behind `Q34`. Matching them is what makes this change
    # gradeable: anything visible in a before/after frame is hue structure and
    # not a level change.
    #
    # ⚠️ **Re-derive these if the ramp moves, and `tools/ring_weights.py` is what
    # re-derives them** — including when the *survey* moves under them, which is
    # the case `Q34′` answers. Three materials against two constraints leave a
    # line of solutions, so the tool moves each set the smallest distance that
    # lands on its bin's ramp mean, keeping whichever material is dominant
    # dominant. Weights reached any other way are not comparable with these.
    surveyed:
      rings:
        # Near-neutral, and 40.5% of the surveyed stock. No sectors: below this
        # chroma the hue angle is mostly measurement noise, and splitting on it
        # would assign cladding from a number that is not really there.
        - up_to_chroma: 5.0
          weights: {panel_grey: 0.56, render_cool: 0.28, tile_neutral: 0.16}
        # Everything with hue worth reading. ⚠️ Sectors rather than a second flat
        # bin, because chroma alone cannot tell cool grey from neutral grey —
        # C* 2.6 against 3.1, but opposite in b*.
        - up_to_chroma: .inf
          sectors:
            # Warm: 30-180 deg is +b*, the cream / beige / ochre direction, and
            # it is where the coloured stock overwhelmingly sits — 83.5% of this
            # ring. render_warm is the ochre tail.
            - from_deg: 30.0
              weights: {render_pale: 0.46, tile_neutral: 0.36, render_warm: 0.18}
            # Cool: 180 deg round through 360 and on to 30, the -b* blue-grey
            # direction. Only 16.5% of the ring, and the ramp gave it the darkest
            # mean of any bin, which is why the split is this lopsided.
            - from_deg: 180.0
              weights: {panel_grey: 0.89, render_cool: 0.11}

  # Per-building brightness variation, seeded from the building id so it is
  # stable across runs. Without it a height band renders as one flat mass and
  # the block reads as a single object rather than many buildings.
  colour_jitter: 0.06

  # Per-building hue measured off the individualised set's photo textures, and
  # keyed by the building id's stem. Optional by design: the survey is a 4.9 GB
  # read cached under etl/sources/ and gitignored, so a clone without it builds
  # the same city the height bands alone produced. See docs/DECISIONS.md,
  # Q34, for what was measured and, more importantly, what was not.
  #
  # ⚠️ Hue only. The same measurement carries a per-building L* and it is NOT
  # used, and the intuitive reason — sunlit walls differ from shaded ones — is
  # testable and wrong. It is unused because it is not *needed*: the flat city it
  # would have fixed was fixed by the height_bands anchor above, for two numbers
  # and no new data. Revisit only if the city still reads flat with the bands
  # where they are. `colour.py`'s header carries the argument and DECISIONS.md
  # the arithmetic.
  #
  # `strength` multiplies the measured chroma. 1.0 is faithful and *muted* —
  # mean measured C* is 7.75, and six buildings in ten sit under C* 8. Above 1.0
  # keeps which building is warmer and exaggerates only by how much, so the
  # ordering stays evidence while the amount becomes art direction. This is the
  # line to move if the city reads too grey or too candy.
  #
  # ⚠️ At 2.0 the city reads as both at once, so this line cannot reach the
  # state it describes — one building in four exceeds C* 20, above anything
  # ART_DESIGN.md's palette authorises, and the middle is still muted. `Q30` has
  # why. Moving this or the survey invalidates both; `tools/facade_chroma.py`
  # re-measures them.
  #
  # `vegetation_max` drops a survey row whose sample was more than this fraction
  # canopy — 36 of Wan Chai's 2,213 at 0.5. They sit 4.45 a* to the green side of
  # the rest, and `strength` below then doubles that, so an unfiltered one reaches
  # the facade about 9 a* green. Omit the key for no threshold at all; setting one
  # makes the survey's `vegetation` column required, so a threshold can never
  # silently filter nothing.
  #
  # `source` is a filename, not a path: the pipeline resolves it through
  # `fetch.source_dir`, which is the single definition of the sources-tree
  # layout. A city's own config never repeats its own id.
  facade_hue:
    source: facade_lab.json
    strength: 2.0
    vegetation_max: 0.5

  # Per-building survey verdicts consumed into `TEXCOORD_1` (schema 6). Both
  # are bare filenames resolved through `fetch.source_dir`, like `facade_hue`'s
  # `source`, and both optional on the same contract: the tables are gitignored
  # derived data, so a clone without them builds the same hash-driven city —
  # absent, every building ships the refusal sentinel.
  #
  # `glazing` is `tools/facade_glazing.py --merge` — the dark-mode (L*, b*)
  # glass tint, read only for buildings the reader called glazed (`Q40`).
  # `grammar` is `tools/facade_grammar.py --merge` — the majority-voted glazed
  # verdict and five-state grammar per building (`Q41`).
  facade_survey:
    glazing: facade_glazing.json
    grammar: facade_grammar.json

  # Vertex-clustering cell size per LOD tier, in metres, coarsest last.
  #
  # No 0.0 entry, and that is the P2-1 review's verdict rather than an
  # oversight: an exact-weld tier was indistinguishable from 1.5 m at closest
  # range and cost 30.5 MB of a 51.6 MB bundle. Adding one back is this line
  # plus a rebuild. See docs/ART_DESIGN.md "LOD policy" and Q16.
  lod_cell_sizes_m: [1.5, 4.0]

# The iB1000 building-block layer — Q47's primary podium-boundary route. One
# `Building` polygon layer whose `TYPEOFBUILDINGBLOCK` domain splits towers
# from podium blocks, with base/roof levels in mPD that are 100% filled on
# both (verified counts in DATA_SOURCES.md). Column names are the Lands
# Department's schema, mapped to roles here per hard rule 3.
podiums:
  source: topography
  # Each sheet zip nests its geodatabase as `<SHEETNO>/<SHEETNO>.gdb` — a
  # LandsD packaging fact. `{tile}` is the sheet id from the index.
  member: "{tile}/{tile}.gdb"
  blocks:
    layer: Building
    fields:
      block_type: TYPEOFBUILDINGBLOCK
      base_level: BASELEVEL
      roof_level: ROOFLEVEL
      certainty: CERTAINTY
  # The `TYPEOFBUILDINGBLOCK` domain values the join asks for, mapped like
  # `fields` above: which letter means "podium block" is the data dictionary's
  # spelling. The domain also carries `OS` open-sided and `TS` temporary,
  # which the join reads past — neither is a tower nor sets a boundary.
  codes:
    tower: T
    podium: P

# Where the carriageway edge is *published*, for tools/carriageway_margin.py.
# Read by no build. Q57 established that the width this project calls
# unpublished is published twice over, and both sources are already on disk.
#
# ⚠️ Two entries, and that is the point rather than belt-and-braces. Q57 traced
# four wrong "no source publishes that" claims to one mechanism: a fact measured
# against a single dataset and then generalised to the estate. Reading one
# margin layer and calling the result "the width" would be that same step.
#
# ⚠️ Three-letter codes are traps across these two files. `RM` is *Road margin*
# in iB1000 and a *road-marking code prefix* in the Traffic Aids Drawings; `TW`
# is *Tramway* in one and *tactile warning strip* in the other. Every code the
# tool matches on comes from this block, never from a literal in the tool.
carriageway_survey:
  # What TD's Transport Planning & Design Manual Vol 2 Ch 3 (March 2026) permits
  # a carriageway to be. READ, not fetched — see DATA_SOURCES.md, which carries
  # the table and the reason nothing in etl/ downloads it.
  #
  # 🔴 These bound the instrument. They never assign a width. A width taken from
  # a road's class would be authoring policy with better provenance, which is
  # the move `roads.lanes_by_min_speed_limit_kph` already makes and the one Q95
  # was opened about.
  width_bounds:
    # The widest urban carriageway in the manual:
    #   13.5 m  four-lane single carriageway         (Table 3.4.2.1)
    # + 3.0 m   optional parking strip beside it     (3.4.2.6)
    # = 16.5 m
    # 3.4.4.1's curve widening (15.8 m under a 150 m radius) is inside this and
    # needs no term of its own. Above it a two-sided ray has crossed a median, a
    # 5.5 m tram reserve (3.4.2.3) or a junction mouth.
    #
    # ⚠️ It is a plausibility bound and NOT a confound filter. Two opposed
    # carriageways summing to 13 m are a legal four-lane single carriageway and
    # pass this cleanly; what separates them is the off-centre column, because
    # 621 of the region's 737 level-0 edges are one-way.
    max_m: 16.5

    # Table 3.4.2.1's two-lane single-carriageway minimum.
    #
    # ⚠️ REPORTED, never refused. The table is headed *Minimum* and 3.4.2.2 lets
    # widths fall below it "on economic or other grounds"; Wan Chai is full of
    # genuinely sub-standard back streets. Refusing here would delete them and
    # publish a region that agrees with TD's minimum by construction — the
    # ceiling's trap, inverted.
    min_m: 7.3

    # One through lane, 4.3.9.8's narrow end. Below this the ray has landed on
    # a hatched island or a bay line rather than the far kerb, and the reading
    # is not a carriageway at all. This one IS a refusal, and it is safe to
    # gate on precisely because it refuses almost nothing.
    hard_min_m: 3.0

    # 4.3.9.8 — a through traffic lane is 3.0-3.65 m, exclusive of hard strips.
    #
    # 🔴 A bracket, and deliberately NOT `roads.lane_width_m`. Dividing a
    # measured width by the authored 3.2 would make this instrument agree with
    # the constant under test by construction, which is Q72's tautology one
    # dimension over. The bracket is ambiguous on much of the network and that
    # ambiguity is published rather than resolved by fiat.
    lane_m: [3.0, 3.65]

    # ── Splitting a one-way span back into two carriageways (Q95 follow-on) ──
    #
    # Everything above bounds a SPAN. 621 of the region's 737 level-0 edges are
    # one-way, so on most of the network the centreline sits inside one
    # carriageway and the two-sided ray crosses the opposed one as well. The
    # three below bound the PARTS: one carriageway, the thing between them, and
    # how anti-parallel two centrelines must run to be read as a pair at all.

    # Table 3.4.2.1, dual carriageway, four lanes, Trunk Road — the widest
    # single carriageway of a pair the manual permits.
    #
    # 🔴 A DIFFERENT COLUMN from max_m's, and that is the point. max_m 16.5 is
    # a four-lane *single* carriageway plus a parking strip; a decomposed half
    # is by definition a *dual* carriageway, and the manual publishes a tighter
    # ceiling for it. Reading the single column at both scales would bound the
    # half by a figure it could never reach.
    dual_max_m: 14.6

    # Table 3.4.2.1, the SAME dual column's other end — a two-lane dual
    # carriageway for a Primary, District or Local Distributor. The narrowest
    # opposed carriageway the manual permits.
    #
    # 🔴 It bounds the room a span leaves BEYOND the edge's own carriageway,
    # never a carriageway itself. `2 x the near ray` is what the edge sits in;
    # subtract it from the span and what is left is the space an opposed
    # carriageway would have to occupy. Under `hard_min_m` there is not one
    # through lane of it, so the ray stopped at the far kerb of the road it was
    # walking and the span IS this edge's width. At or above this figure there
    # is room for the narrowest dual carriageway TD publishes, so the span may
    # have crossed a median and stays a span. Between the two nothing is read.
    #
    # ⚠️ The middle band is not indecision to tune away — it is the honest
    # answer for a reading with room for a lane but not a carriageway, and it is
    # what keeps a real counter-example out of the published widths. Q95 records
    # TONNOCHY ROAD e130/e142 at a 16.7 m span with halves of 6.43 and 11.78,
    # "not a ray that stayed put"; a single threshold anywhere in this gap would
    # publish that span as somebody's carriageway width.
    #
    # ⚠️ Distributors only. The Trunk Road row of the same column is 7.3 m, so
    # this is the permissive end and a span is called crossed as readily as the
    # manual allows. Refusing more here would publish more widths, which is the
    # direction an instrument grading its own project must not lean.
    dual_min_m: 6.75

    # 3.4.2.3 — a double-track tram reserve requires 5.5 m, the widest
    # separator transcribed in DATA_SOURCES.md.
    #
    # ⚠️ REPORTED, never refused, and the reason is that a wide residual is
    # AMBIGUOUS where a negative one is not. Negative means the two halves plus
    # their separator exceed the span that contains them, which cannot be true
    # and is the decomposition failing. Wide means either a real median or a
    # centreline this instrument has mis-centred, and nothing here can tell
    # those apart — so it is published as a distribution and read, not gated.
    # ⚠️ A distribution sitting above this is a finding about a central-reserve
    # clause nobody has transcribed, which is a DATA_SOURCES.md change and not
    # a bar to raise.
    median_max_m: 5.5

    # How far off anti-parallel two centrelines may run and still pair.
    #
    # 🔴 The one value in this block with NO clause behind it, so it is swept
    # rather than chosen and the sweep is published beside the table. That is
    # not ceremony: DECISIONS.md's NO ENTRY entry rejected a pairing rule built
    # on a free radius because its count ran 8 → 29 → 49 → 80 as the radius
    # went 10 → 30 m. The search DISTANCE here carries no knob — it is the
    # station's own measured far ray — and this angle is the only thing left
    # that could behave the same way. A count that plateaus across the sweep is
    # what says it does not.
    #
    # ⚠️ Refused at 90 and above in config.py, where a perpendicular side street
    # would read as an opposed carriageway.
    pair_bearing_tolerance_deg: 30.0

  edges:
    # Ordered by preference — the tool takes the first source that answers a
    # station. TD's own painted edge leads: it is semantically the edge of the
    # carriageway, where iB1000's margin is a topographic line that may follow
    # a kerb, a wall or a lot boundary. It is far sparser, which is why the
    # denser topographic source sits behind it rather than instead of it.
    - name: traffic_aids
      source: traffic_aids_drawings_gdb
      layer: DTAD_RD_MARK_LINE
      fields:
        edge_type: LINETYPE
        # ⚠️ NOT the Road Network v2 integer level. The FGDB data specification
        # defines this only as "Relative level (e.g. A01, A02)", 3-char text,
        # and does not enumerate the domain — so which value means "at grade"
        # is measured below, not read.
        elevation: ELEVATION
      # RM1108/RM1109 EDGE OF CARRIAGEWAY, per the Index Plan drawing
      # CT174/51-5(1)F inside the dataset's own dataspec zip. One marking, two
      # codes.
      codes: [RM1108, RM1109]
      # ⚠️ Measured 2026-08-20 against the built graph, because guessing here
      # would have been the exact Q57 mechanism — and the guess would have been
      # wrong. Of the 317 RM1108/RM1109 features in region, taking each
      # feature's midpoint and asking how far it sits from the nearest level-0
      # and level-1 edge:
      #
      #   code   n    median to L0   median to L1   within 8 m of L1
      #   A01   180        5.6 m          2.6 m          93%
      #   null  126        2.7 m         11.4 m          38%
      #   A03    11       27.4 m        218.1 m           0%
      #
      # A01 is the *elevated* network, not the at-grade one, despite being the
      # commonest value. Null is at grade. A03 is neither — 27 m from any
      # level-0 edge, so it describes nothing this instrument measures and is
      # excluded rather than counted as a kerb.
      #
      # Stated as an exclusion because the at-grade value is null, which a list
      # of included codes cannot spell.
      off_grade_codes: [A01, A03]

    # iB1000 CartoTransLine, dTransportationLineType. `RM` is "Road margin" in
    # LandsD's data dictionary, verbatim — 56,286 segments over the six sheets
    # the podium join has been downloading since P3-7a.
    - name: ib1000
      source: topography
      member: "{tile}/{tile}.gdb"
      layer: CartoTransLine
      fields:
        edge_type: TRANSPORTATIONLINETYPE
      # ⚠️ `RMU` — "Road margin under elevated structures" — is deliberately
      # absent, and that omission *is* the grade filter for this publisher.
      # iB1000 has no level column, so the under-deck margin is separated by
      # carrying its own code; leaving it out of this list excludes it. There
      # is nothing for `off_grade_codes` to do here, and it must stay out —
      # listing codes against a column this layer does not have is refused at
      # load rather than silently filtering nothing.
      codes: [RM]

    # 🔴 HyD's maintained carriageway, as an AREA (`Q94`). Third in preference
    # and not first, though it is the most authoritative reading of the three:
    # `Q95`'s figures were all measured against the two line publishers, and
    # putting this ahead of them re-baselines the lot. Measured, with it second:
    # `e503` STEWART ROAD moved 10.536 -> 10.462 m and `e119` TONNOCHY ROAD's
    # published 16.25 m was lost outright.
    #
    # 🔴 **Third does NOT mean "only where the others are silent", and the
    # difference is measured rather than assumed.** The publisher loop runs per
    # STATION: where the two line publishers both fail to span a station and
    # this one does, its reading joins that edge's sample — including on edges
    # they have already licensed. So it adds 33 edges *and* refines 50, shifting
    # their medians by p50 **0.019 m** (p90 0.300, max 2.035 on `e134` HENNESSY
    # ROAD), and `e373` GLOUCESTER ROAD's 15.00 m falls out of the bounds
    # entirely once its extra stations are in the median. What third *does*
    # guarantee is that this publisher never OVERRIDES a station the other two
    # answered — it only fills ones they left empty.
    #
    # ⚠️ **`geometry: area` is a different measurement, not a different reader.**
    # HyD tiles Wan Chai's carriageway into 552 polygons and an internal seam
    # between two of them is not a kerb, so `_union_boundary` drops every segment
    # two polygons share. Without it a ray stops at the nearest seam and reports
    # a plausible, wrong width.
    - name: hyd_pavement
      source: pavement_polygon
      # `pyogrio` names a GeoJSON layer after the filename stem, so this tracks
      # `paged_sources.pavement_polygon.filename`.
      layer: INV_PG
      fields:
        edge_type: FEAT_TYPE
        elevation: LVL
      # `1 = Carriageway` in the layer's own coded-value domain, published in the
      # service metadata rather than in a separate specification. The domain is
      # transcribed in DATA_SOURCES.md; the other eleven codes are footway,
      # traffic island, run-in and car park, none of which is a carriageway edge.
      # ⚠️ Quoted because the field is a SmallInteger and the comparison is on
      # `str()`, as it is for the two publishers above.
      codes: ["1"]
      # `LVL` 0 is ground level. ⚠️ Stated as an exclusion for the reason the two
      # publishers above state theirs — but NOT for their reason that at-grade is
      # the unmarked case. Here the domain is fully published and complete, so
      # this is the one grade filter in the block that could have been written as
      # an inclusion. It is not, so that all three read the same way.
      off_grade_codes: ["1", "2", "3", "-1", "-2", "-3"]
      geometry: area

# The tramway, drawn by pipeline/tramway.py as tram.glb (P3-14, Q58).
#
# ⚠️ **This is a build input, not an instrument's truth side** — unlike
# `carriageway_survey` directly above, which reads the same layer and is only
# ever opened by tools/carriageway_margin.py. Same shape, different standing.
#
# ⚠️ **`TW` is Tramway here and *tactile warning strip* in the Traffic Aids
# Drawings**, where `DTAD_TW_STRIP_LINE` carries 778 features at dropped kerbs
# across every street in the region. That trap is Q57's, recorded because it
# nearly became a published claim; this block reads iB1000 and nothing else.
#
# ⚠️ **`codes: [TW]` selects rails, not track centrelines — measured, not
# assumed.** Q57 and DATA_SOURCES.md both described the layer as tramway
# centrelines. Q58 walked every tram-flagged edge and found 56.5% of stations
# cross exactly **four** parts, with the gap between neighbours sharply
# unimodal at 1.05-1.20 m: that is the 1,067 mm gauge, so a "part" is one rail.
# Reading them as centrelines would draw a bed a lane wide down each rail.
#
#   measured over 1,698 four-rail cross-sections
#   gauge               p10 1.066  p50 1.124  p90 1.221 m   (published 1.067)
#   track separation    p10 2.445  p50 2.597  p90 2.768 m
#
# ⚠️ **This is why the tramway is geometry and roads.tram_streets cannot place
# it.** 80 of the 86 flagged edges are one-way — Hennessy, Johnston, Yee Wo and
# Causeway are opposed pairs — so the reserve runs *between* two ribbons rather
# than down the middle of either. Only 18.8% of those cross-sections have both
# tracks on the drawn carriageway at all (Hennessy 1.5%, Causeway 0.0%), and the
# outer rail sits a median 3.26 m past the drawn kerb. `tram_streets` stays as
# it is and keeps its own job: it says which streets carry a tram, which is a
# fact about the street, not a position.
tramway:
  source: topography
  member: "{tile}/{tile}.gdb"
  layer: CartoTransLine
  fields:
    line_type: TRANSPORTATIONLINETYPE
  codes: [TW]

  # Hong Kong Tramways' published gauge, and how far a neighbouring rail may sit
  # from it and still be read as the other half of the same track. The tolerance
  # is the source's digitising spread rather than a preference: the measured p10
  # to p90 above spans 1.066-1.221, so 0.35 takes the whole distribution and
  # still stops well short of the 2.597 m separation that would pair a rail with
  # the next track along. Refused at load if it ever reaches the gauge.
  gauge_m: 1.067
  pair_tolerance_m: 0.35

  # Drawing. `rail_width_m` is authored wider than a 70 mm rail head for the
  # reason tuning/road_markings.tres gives about line widths — a truthful one is
  # under a pixel at the distance the player is looking — but unlike a painted
  # line it may not be widened past the four-foot it has to sit inside.
  rail_width_m: 0.14
  # ⚠️ **One bed per track, and its ceiling is the track separation measured
  # above, not taste.** Two beds are drawn 2.597 m apart at the median and
  # 2.445 at p10; anything wider than that overlaps its neighbour, and two
  # coplanar beds at the same lift z-fight down the whole reserve. 2.20 clears
  # p10 with 0.24 m to spare and leaves a sliver of ground showing between the
  # tracks, which at any speed reads as one continuous reserve.
  bed_width_m: 2.20

  # ⚠️ **The ground and the level-0 carriageway are coplanar by construction**:
  # roads.py samples the terrain and lays the ribbon at `terrain + 0.0`, which
  # is the property tools/ground_clearance.py exists to measure. A tramway laid
  # at deck height would z-fight the ground it rests on down its whole length,
  # so the bed is lifted clear and the rail sits proud of the bed — which is
  # also what a rail does.
  bed_lift_m: 0.02
  rail_lift_m: 0.01

  # Furthest a rail station may sit from a level-0 centreline and still take its
  # height from it. The reserve runs between two carriageways a measured 6-9 m
  # from either, so this is generous by design; what it excludes is depot and
  # siding track with no drivable road near it.
  max_snap_m: 25.0

  rail_material: steel_rail
  bed_material: concrete_sooty

# Published turn arrows (P3-15, closes the arrow half of Q53).
#
# Q53 held arrows out of P3-12 because "there is no marking data in any source".
# Q57 retired that on 2026-08-20: it reasoned about Road Network v2 — the
# *semantic* dataset, which is exhaustively right about what is restricted and
# says nothing about paint — and concluded about the whole estate. TD's Traffic
# Aids Drawings v2 publishes DTAD_RD_MARK_SYM_PT: 1,365 marking symbols in this
# region, each an RM code and a bearing. Arrow content is read, not invented.
#
# ⚠️ **ANGLE is a mathematical angle, not a compass bearing.** Game heading is
# `(90 - ANGLE) mod 360`. Measured on the 314 RM1017 straight-ahead symbols
# within 4 m of a level-0 centreline, against the host edge's own heading:
# as-is p50 52.0 deg, ANGLE+90 p50 38.0, 180-ANGLE p50 89.1, and `90 - ANGLE`
# **p50 0.9 deg, p90 3.7, 97.8% within 10**. The pipeline does not restate this
# in prose; tests/test_arrows.py asserts it against the same heading fares.Snap
# publishes, which is surface.mitres's own frame.
#
# ⚠️ **The codes below are transcribed from the publisher's index plan**, TD
# drawing CT174/51-5(1)F "ROAD MARKINGS (RM 1001-1080)", inside
# traffic_aids_data_dictionary. They are NOT inferred from how often each code
# appears, and that matters more here than anywhere else in this file: nothing
# downstream can grade the mapping. Every consumer takes "1019 means turn left"
# on trust, exactly as Q56 found every consumer taking double-versus-single on
# trust from NSR.TIME_ZONE.
#
# ⚠️ **Four families of code look like turn arrows and are not.** Reading the
# index plan rather than the histogram is what keeps them out:
#   RM1116-1119  WARNING ARROW      — the deviation arrow before a lane closure.
#                                     **61 in region**, and the second most
#                                     common arrow-shaped code after RM1017.
#                                     Painting these as turn instructions would
#                                     tell the player to leave the carriageway.
#   RM1135/1136  LOOK RIGHT 望右 /   — pedestrian crossing markings, and the two
#                LOOK LEFT 望左        commonest codes in the region after
#                                     RM1017 (127 and 123).
#   RM1167-1169  CYCLE TRACK arrows — a cycle track is not a lane. **0 here**,
#                                     named because the second city is the
#                                     business case and this list is what it
#                                     inherits.
#   RM1144       LET IN LANE        — lettering, not a symbol. **0 here.**
# Q57's TACW trap is the same shape: a code that looks like the answer.
#
# ⚠️ **Every turn arrow is published twice, at two lengths** — 4000 mm and
# 6000 mm — so length belongs to the code. Wan Chai publishes only the 4 m
# variants; the 6 m rows are here because the estate has them, and a region that
# uses one would otherwise draw it a third too short. In region, at grade:
# RM1017 x337, RM1019 x175, RM1027 x102, RM1021 x92, RM1025 x46, RM1023 x8,
# RM1029 x1 — 761 of 781 published turn arrows, the other 20 being on structure.
arrows:
  source: traffic_aids_drawings_gdb
  layer: DTAD_RD_MARK_SYM_PT
  fields:
    code: REFNAME
    bearing: ANGLE
    level: ELEVATION
    size: SYMBOL_SIZE

  glyphs:
    "1017": {movements: [ahead], length_m: 4.0}
    "1018": {movements: [ahead], length_m: 6.0}
    "1019": {movements: [left], length_m: 4.0}
    "1020": {movements: [left], length_m: 6.0}
    "1021": {movements: [right], length_m: 4.0}
    "1022": {movements: [right], length_m: 6.0}
    "1023": {movements: [left, right], length_m: 4.0}
    "1024": {movements: [left, right], length_m: 6.0}
    "1025": {movements: [ahead, right], length_m: 4.0}
    "1026": {movements: [ahead, right], length_m: 6.0}
    "1027": {movements: [ahead, left], length_m: 4.0}
    "1028": {movements: [ahead, left], length_m: 6.0}
    "1029": {movements: [ahead, left, right], length_m: 4.0}
    "1030": {movements: [ahead, left, right], length_m: 6.0}

  # Proportions, as fractions of each arrow's own length, so the 4 m and 6 m
  # variants of one marking scale together.
  #
  # 🔴 **Measured off TD's own pictogram, 2026-08-28 (Q93) — the figures that
  # stood here before were authored and every one of them was wrong.**
  # CT174/51-5(1)F publishes `LENGTH = 4000` / `6000` for RM1017-RM1030 and no
  # other dimension, so the shape can come from nowhere but the drawing. Read at
  # 700 dpi off two independent cells that agree, RM1017 (ahead) and RM1027
  # (ahead & turn left), as a fraction of each glyph's own drawn length:
  #
  #   ahead head length   0.390   (was 0.325)
  #   ahead head width    0.122   (was 0.235 — nearly twice the drawing)
  #   stem, under head    0.032   (was a uniform 0.085; the drawing tapers)
  #   stem, at the tail   0.076
  #   branch reach        0.150   (was 0.28)   — measured, then AUTHORED, below
  #   branch head length  0.100               — measured, then AUTHORED, below
  #   branch barb span    0.233   (this model has no barbs; it is the head's
  #                                full width across, so branch_head_width_frac)
  #   branch drop         0.145   (was derived from the head width)
  #
  # On a 4 m arrow that is a 1.56 m head 0.49 m across and a stem tapering 0.30 m
  # to 0.13 m.
  #
  # ✅ **The sheet is drawn to proportion, and that was checked rather than
  # assumed.** It is stamped NOT TO SCALE, which would ordinarily make a measured
  # proportion worthless. RM1016 AUTOTOLL publishes its own `SIZE = 5600(H) x
  # 2000` — a ratio of 2.800 — and its pictogram measures **2.802**. So the stamp
  # means there is no scale bar, not that the symbols are stylised, and the
  # figures above stand.
  #
  # 🔴 **The three branch figures are AUTHORED, and that is a reversal.** They
  # were measured off RM1027 like everything above — reach 0.150, head 0.100
  # long, barb span 0.233 — and the result was reported from the driving seat as
  # not making sense. It is not a measurement error: TD's branch head is
  # genuinely **wider than it is deep**, because what makes it read as a
  # direction is a pair of thin barbs sweeping back from the tip, and a plain
  # triangle at those proportions is a mushroom on the shaft. Drawn faithfully
  # as a six-point dart it reads as a detached diamond instead, and its barbs
  # are 0.09 m on a 4 m arrow — below a lane stripe, so Q91's sub-pixel problem
  # eats them at any driving distance.
  #
  # So the branch is drawn as the ONE shape this model can say clearly: an
  # arrowhead longer than it is wide, on a short arm. Sized against the frame
  # rather than the sheet — 0.54 m long, 0.46 m across, tip 0.76 m out on a 4 m
  # arrow — which is the debt Q60 records for railing height and P3-16 for plate
  # dimensions, at a third layer. ⚠️ The hook and the barbs are not modelled.
  #
  # ⚠️ **This licenses nothing above it.** The ahead head and the stem are
  # measured and an overlay against TD's own cell agrees on them; only the three
  # branch figures were declined.
  head_length_frac: 0.390
  head_width_frac: 0.122
  stem_width_nose_frac: 0.032
  stem_width_tail_frac: 0.076
  branch_reach_frac: 0.190
  branch_head_length_frac: 0.135
  branch_head_width_frac: 0.115
  branch_drop_frac: 0.145

  # ⚠️ **The ground and the level-0 carriageway are coplanar by construction**,
  # the same property tramway.bed_lift_m is lifted clear of. Paint laid at deck
  # height z-fights the road it is painted on.
  lift_m: 0.015

  # Furthest a symbol may sit from a level-0 centreline and still be placed.
  # 12 m is a little over the widest drawn half-width in the region, so it
  # admits an arrow in the outermost lane of the widest street and refuses one
  # that has matched across a junction mouth to a road it is not on. Measured,
  # and `arrows.json` republishes it as `offset_m` on every run so this comment
  # is checkable rather than a number from a scratch script (`Q37`): the gap to
  # the nearest level-0 centreline reads p50 1.64 m, p90 3.78, p99 6.49.
  max_offset_m: 12.0

  # How far a symbol's own bearing may sit from its host edge's heading before
  # the match is refused. The residual is p50 0.9 deg and p90 3.7 on symbols
  # that matched correctly, so 30 is loose against the population it keeps and
  # tight against the failure it exists to catch — a symbol lying square across
  # its edge, which is the signature of a match to the wrong road. `arrows.json`
  # publishes `axis_residual_deg` over the symbols this *refuses* as well as the
  # ones it keeps — max 88.5 deg — because a distribution taken after its own
  # filter is confined to that filter and can say nothing (`Q58`).
  #
  # ⚠️ It refuses the **match**, and never rotates the arrow onto the road. An
  # arrow turned to agree with its edge would be an invented marking in Q54's
  # sense, and it would render perfectly.
  bearing_tolerance_deg: 30.0

# Published traffic signs (P3-16, the sign half of the DTAD estate).
#
# ⚠️ **DTAD_TS_ABV_PT IS NOT WHERE THE SIGN IS.** The publisher's own fgdb
# specification calls it "Traffic sign **abbreviation** point" and calls
# DTAD_TS_POLE_PT "Traffic sign pole point". Measured over this region: **zero**
# of 3,276 abbreviation points sit on a pole, the nearest pole is p50 2.63 m
# away (p90 8.25, max 115.5), and the direction of that offset is uncorrelated
# with ANGLE — 48% within 20 deg of perpendicular, which is noise. The
# abbreviation point is where a draughtsman put the label so the drawing stayed
# legible. It says *which* sign, never *where*.
#
# So the position is read as data and never as geometry — Q54's rule, the same
# move arrows: makes when it registers a symbol into the lane the ribbon
# actually has. The pole is the object; the abbreviation point names it.
#
# ⚠️ **GG_NAME — "Graphical group Name" in the spec — is the join**, and it is
# the only thing that ties the two layers. 3,032 of the region's 3,276 signs
# (92.6%) resolve to exactly one pole through it, 24 to more than one, 220 to
# none. Signs group 1 to 7 per GG_NAME, which is a pole carrying a stack of
# plates. The 244 that do not resolve to exactly one pole are refused and
# counted, never dragged onto the nearest pole.
signs:
  source: traffic_aids_drawings_gdb
  layer: DTAD_TS_ABV_PT
  fields:
    code: SIGNID
    bearing: ANGLE
    level: ELEVATION
    group: GG_NAME

  # The pole layer, read through the same source. Its own ANGLE is not read:
  # the plate's orientation comes from the sign, and the pole is round.
  poles:
    layer: DTAD_TS_POLE_PT
    fields:
      group: GG_NAME
      level: ELEVATION

  # ---- the faces, transcribed from the publisher's index plan ----
  #
  # ⚠️ **Read by eye off TD's own TS Index Plan sheets**, inside the dataspec
  # zip that traffic_aids_data_dictionary fetches — CT174/51-1(1)C
  # "(TS 101 - 205)" for the regulatory codes and CT174/51-3(2)D
  # "(TS 701 - 805)" for the supplementary arrow plates. Neither has a text
  # layer (pdftotext returns nothing), so this is Q59's glyph-table rule
  # restated: the table is transcribed from the publisher, never inferred from
  # the histogram.
  #
  # ⚠️ **They are NOT scanned, which this comment used to say.** pdfinfo reads
  # `CT174_51_11.dgn` / PScript5.dll / Distiller and pdffonts returns no
  # embedded font: a MicroStation DGN export whose ruling lines, digits and most
  # pictograms are vector *paths*. "No text layer" is why the digits must be
  # read; "scanned" is why the wrong extraction method looked necessary. P3-20
  # depends on the difference — the table grid is recoverable exactly rather
  # than detected in pixels.
  #
  # ⚠️ **~/hk-traffic-sign-map's signCatalogue.json is cross-check only, never
  # authority.** It is OCR-built, its own README records partial coverage on the
  # dense sheets, and 380 of this region's signs are uncatalogued (344 of them
  # TSSEPA separators).
  #
  # 🔴 **"It agreed with the sheets on every row below" was here, and it did
  # not.** Its `desc` disagrees with the sheet across TS181-TS183 and the sheet
  # is right — which is the whole reason `Q64` exists. Read its *crops*, which
  # are the deterministic same-cell half of that project and are correct; its
  # descriptions come from a separate full-page model read and carry the shift.
  #
  # ⚠️ **WHAT IS ABSENT IS THE DECISION.** Only signs whose meaning is their
  # *shape* are here — 912 of the region's 3,276. Every sign whose meaning is
  # its **text** is refused: TS860 time plates x148, TS280 parking x74, the
  # TS21xx/TS22xx no-stopping-zone family, the vehicle-class prohibitions.
  # Roughly 2,360 signs. ⚠️ **TS101 STOP x18 was refused with them and is not
  # any more**: it is lettered, from the same sheet and by the same machinery
  # TS102's 讓 uses, so the thing that refused it — a wordless octagon instructs
  # nothing — stopped applying the moment the atlas existed (Q68).
  #
  # 🔴 **"TS182 CYCLES ONLY x155 needs a texture" was here, and it was wrong on
  # the code.** TS182 is ONE WAY TRAFFIC, a pure shape, and it is drawn below;
  # CYCLES ONLY is TS181, which this region does not carry at all. 155 plates —
  # the second-commonest code in region after TS115 — were refused for a reason
  # that never applied to them. See the TS182 face and `Q64`.
  #
  # 🔴 **AND THE REASON IS THE ZERO-TEXTURE RULE, NOT Q42 — an earlier draft of
  # this block cited Q42 and hard rule 8 and both citations were wrong.** Hard
  # rule 8 is about the phrase "Crazy Taxi", a SEGA trademark, and has nothing to
  # do with street furniture. Q42's "never rendered text" is about the facade
  # survey reading real *company* marks — SHUI ON GROUP, REVENUE TOWER, YMCA,
  # FWD — and its reason is trademark exposure. A traffic sign's lettering is
  # none of that: 讓 and GIVE WAY are government traffic-control glyphs, published
  # in the same TD index plan the RM arrow glyphs above are transcribed from.
  #
  # What actually refuses them is that **this game ships zero textures**
  # (`Texture memory: 0`, measured), so lettering has to be geometry — and a
  # 24-stroke character on a 0.68 m plate seen from a moving car is a few pixels
  # of smudge, which reads worse than a clean shape. The refusal is a *rendering*
  # judgement and it should be argued as one, not borrowed from a rule about
  # trademarks.
  #
  # ⚠️ **TS102 GIVE WAY is drawn with its lettering omitted, and it is the one
  # incomplete face here.** The plate reads "GIVE WAY / 讓" on the index sheet;
  # what ships **for now** is the red-bordered inverted triangle alone, and from
  # the road it reads as a blank plate — which is how the user found it.
  #
  # 🔴 **讓 is owed, not refused.** It is coming as part of the sign texture
  # atlas, and the reason it is not here is the no-texture contract rather than
  # anything about trademarks: see the scope note above. Thickening the border to
  # the wordless Vienna-Convention proportion was tried as a substitute and
  # rejected by the user in favour of the real character.
  #
  # ⚠️ **`rank` orders a stack, and it is read off the sheet the code is defined
  # on** — CT174/51-1(1)C is titled "TRAFFIC SIGNS (REGULATORY)" and
  # CT174/51-3(2)D "TRAFFIC SIGNS (SUPPLEMENTARY)", so this is the publisher's own
  # classification rather than an art call. It defaults to `regulatory`.
  # A main sign goes on top and its supplementary plate hangs below it, which is
  # the rule ~/hk-traffic-sign-map's compute-stacks.mjs encodes as
  # `regulatory 0 → … → supplementary 9`. Sorting by SIGNID alone puts TS733
  # above TS115 and hangs the NO ENTRY off the bottom of its own arrow plate.
  #
  # A face is a stack of flat coloured layers drawn on the front of the plate,
  # first listed at the bottom. `size` is a fraction of the plate's own
  # dimension, so a 600 mm disc and a 750 mm disc scale together. `draw` names
  # geometry this pipeline has; a word it does not know fails the load rather
  # than drawing nothing.
  faces:
    # -- prohibitory: red ring or red disc --
    # NO ENTRY, and the commonest code in the region.
    # ⚠️ **0.87, measured off the cell (`Q67`), where this said 0.66.** The bar
    # spans nearly the full disc on TD's own drawing and the shipped one stopped
    # two thirds of the way across. Its thickness moved with it, in code rather
    # than here — see `_NO_ENTRY_BAR_THICKNESS`, and see `Q67` for why the two
    # bars have the same area and so agreed with each other for a year.
    # 🔴 **`faces_against_traffic` on the two NO ENTRY faces, and only on them**
    # (`Q72`). Every other face here speaks to the traffic already legally
    # proceeding and so stands facing back down the road at it, which is what
    # `_facing_from_side` derives from the pole. These two speak to a driver who
    # would come *in* the wrong way, so they face **with** the flow instead —
    # 180 degrees from their own post.
    #
    # ⚠️ **It is a property of the FACE, not of the post.** 82 of this region's
    # 499 posts carry a NO ENTRY beside a GIVE WAY, a mandatory disc or a ONE WAY
    # plate; on the street those are back-to-back, and a facing derived from the
    # pole alone cannot say so. It drew all 84 of those NO ENTRY plates turned at
    # the traffic they are not addressing, which is how the defect was reported —
    # from the driving seat, with a NO ENTRY staring back down a road the car was
    # legally on.
    TS115:                                   # NO ENTRY
      faces_against_traffic: true
      plate: disc
      layers:
        - {draw: disc, colour: red, size: 1.00}
        - {draw: bar, colour: white, size: 0.87}
    # ALL VEHICLES PROHIBITED BOTH DIRECTIONS.
    # ⚠️ **0.80, measured (`Q67`), where this said 0.74.** TD draws ONE
    # prohibitory ring and draws it at 0.10 of the diameter on every face that
    # has one — TS116 0.099, TS131/TS132/TS133 0.102, TS183 0.100 — so the white
    # field is 0.80 throughout. The three turn prohibitions below already said
    # 0.80; this face said 0.74, which is a ring a third too thick, and it is
    # `Q64`'s slash finding arriving on the ring that carries it.
    TS116:                                   # ALL VEHICLES PROHIBITED BOTH DIRECTIONS
      faces_against_traffic: true
      plate: disc
      layers:
        - {draw: disc, colour: red, size: 1.00}
        - {draw: disc, colour: white, size: 0.80}
    TS131:                                   # NO LEFT TURN
      plate: disc
      layers:
        - {draw: disc, colour: red, size: 1.00}
        - {draw: disc, colour: white, size: 0.80}
        - {draw: arrow_bent_left, colour: black, size: 0.62}
        - {draw: slash, colour: red, size: 0.92}
    TS132:                                   # NO RIGHT TURN
      plate: disc
      layers:
        - {draw: disc, colour: red, size: 1.00}
        - {draw: disc, colour: white, size: 0.80}
        - {draw: arrow_bent_right, colour: black, size: 0.62}
        - {draw: slash, colour: red, size: 0.92}
    TS133:                                   # NO U-TURNS
      plate: disc
      layers:
        - {draw: disc, colour: red, size: 1.00}
        - {draw: disc, colour: white, size: 0.80}
        - {draw: arrow_u, colour: black, size: 0.62}
        - {draw: slash, colour: red, size: 0.92}

    # -- mandatory: white symbol on a blue disc --
    #
    # ⚠️ **The sizes here are measured (`Q67`) and every one of them said 0.70.**
    # TD draws these arrows nearly to the rim: TS106's spans 0.85 of the disc,
    # TS107's 0.82, and the two diagonals 0.64. A single authored 0.70 across all
    # five is what a table filled in by eye looks like. ⚠️ The GLYPH weight was
    # right — at 0.85 the drawn white area lands on 0.211 against the sheet's
    # 0.212 — so this is a scale error and not an arrow that needed redrawing.
    # ⚠️ The two bent arrows are left at 0.70: they measure 0.83 blue against a
    # drawn 0.85, which is inside the corner-radius noise the sheet carries.
    TS106: {plate: disc, layers: [{draw: disc, colour: blue, size: 1.00}, {draw: arrow_up, colour: white, size: 0.85}]}
    TS107: {plate: disc, layers: [{draw: disc, colour: blue, size: 1.00}, {draw: arrow_left, colour: white, size: 0.85}]}
    TS108: {plate: disc, layers: [{draw: disc, colour: blue, size: 1.00}, {draw: arrow_right, colour: white, size: 0.85}]}
    TS109: {plate: disc, layers: [{draw: disc, colour: blue, size: 1.00}, {draw: arrow_down_left, colour: white, size: 0.81}]}
    TS110: {plate: disc, layers: [{draw: disc, colour: blue, size: 1.00}, {draw: arrow_down_right, colour: white, size: 0.81}]}
    TS111: {plate: disc, layers: [{draw: disc, colour: blue, size: 1.00}, {draw: arrow_bent_left, colour: white, size: 0.70}]}
    TS112: {plate: disc, layers: [{draw: disc, colour: blue, size: 1.00}, {draw: arrow_bent_right, colour: white, size: 0.70}]}

    # -- stop: the first of the two faces in this game with words on it --
    #
    # ✅ **STOP / 停 SHIPS.** The companion to TS102 below, and the plate half of
    # the pair P3-23 opened: 114 stop lines were drawn on the carriageway with
    # nothing standing over them. Q68 left this as the last thing the atlas
    # refused, deliberately for its own diff, because Q63's point is that an
    # image ships when someone declares room for it — and the room is declared
    # in `generated_signs.gd` in the same commit as this row.
    #
    # 🔴 **This face is drawn in NEGATIVE and that is not a detail.** TD's cell
    # is a solid red octagon with the words *knocked out* of it, where TS102 is
    # black ink on a white field. The crop runs the opposite way for it, so a
    # face's polarity is read off the two colours below — a `white` glyph over a
    # `red` field is lighter than what it sits on, and that is what says
    # knockout. Q67 found TS414 shipped in negative for the same reason: TD
    # draws both ways and the pipeline assumed one.
    #
    # ⚠️ **The colours here are READ, where they used to be assumed.** `colour`
    # on a `text` layer went unused and `sign_text.py` baked black-on-white for
    # every face; the field is the layer beneath the words. Nothing about the
    # face schema changed to allow it.
    #
    # ⚠️ **`octagon` is not a 12-gon with a different count** — a STOP plate has
    # a flat top and flat sides, so its vertices sit at 22.5 + k*45 degrees. Half
    # a step out and it reads as a rotated square, perfectly rendered.
    TS101:
      plate: octagon
      layers:
        - {draw: octagon, colour: red, size: 1.00}
        - {draw: text, colour: white, size: 1.00}

    # -- give way, and the second face with words on it --
    #
    # ✅ **讓 SHIPS (P3-20, 2026-08-23).** This plate reads "GIVE WAY / 讓" on
    # CT174/51-1(1)C and shipped as a bare red triangle until now — from the road
    # a blank sign, which is how the user found it. The `text` layer is a quad
    # carrying the lettering out of the atlas `pipeline/sign_text.py` bakes from
    # that very cell.
    #
    # ⚠️ **Nothing here says where the words go.** `size` is ignored on a `text`
    # layer: the crop, its aspect and its position on the triangle are all read
    # off TD's drawing, which is why the face schema did not have to grow a
    # per-layer offset. ⚠️ **It must be the LAST layer** — layers lift in order
    # and the words go in front of the white field, not behind it.
    #
    # ⚠️ The white triangle stays 0.72 and is not a defect: the sheet's field
    # measures 0.79 wide, but its corners are ROUNDED and this pipeline draws
    # sharp ones, so the two agree on *area* to a point and a half once the
    # lettering is counted. `Q67`'s survey is what says so.
    TS102:
      plate: triangle_down
      layers:
        - {draw: triangle_down, colour: red, size: 1.00}
        - {draw: triangle_down, colour: white, size: 0.72}
        - {draw: text, colour: black, size: 1.00}

    # -- one-way and the supplementary arrow plates --
    # TS182 is regulatory: a white arrow on a blue rectangle. TS733/TS734 are
    # supplementary plates off CT174/51-3(2)D and are **black on white with a
    # black border**, not blue — checked against the sheet, because the obvious
    # assumption is that a one-way arrow plate matches the one-way sign.
    #
    # 🔴 **This face shipped under TS183 until 2026-08-23, and that was wrong by
    # exactly one row.** CT174/51-1(1)C prints 181 (TC 138) CYCLES ONLY,
    # **182 (TC 139) ONE WAY TRAFFIC**, **183 (TC 140) NO STOPPING** — number,
    # pictogram and description in one cell. So the game drew a one-way arrow on
    # 11 plates the street gives a no-stopping saltire, and refused the 155
    # TS182 that are this very face. ⚠️ **The bad row came from
    # ~/hk-traffic-sign-map's signCatalogue.json `desc`, which is shifted one row
    # across TS181-TS183 while its *crops* are correct** — two extraction paths
    # inside that project disagreeing, and this table took the wrong one despite
    # saying the sheet is authority. `Q59`'s rule was right and was not followed;
    # `Q64` is the record. Nothing in the bundle could see it: the mesh is
    # correct, `facing_away` is 0 and `verify_signs.gd` passes. A mislabelled
    # sign renders perfectly.
    # ⚠️ **0.88, measured (`Q67`), where this said 0.78** — TD's one-way arrow
    # runs to within 3% of the plate's top and bottom edges.
    TS182:
      plate: rect
      layers:
        - {draw: rect, colour: blue, size: 1.00}
        - {draw: arrow_up, colour: white, size: 0.88}
    # NO STOPPING — a red saltire over a blue disc inside a red ring. The two
    # bars are two layers rather than one `cross` word so that they sit at two
    # lifts; `backslash` exists for this face and `pipeline/signs.py` says why.
    # The blue field is 0.805 of the diameter on the publisher's own cell, so
    # 0.82 is within a pixel of measured rather than chosen.
    #
    # ⚠️ **0.95, not 1.00, and the reason is that a `disc` is a DODECAGON.**
    # `disc_segments: 12` puts a vertex every 30 degrees, so the rim's inscribed
    # radius is `cos(15 deg)` = 0.966 of its circumscribed one — and a saltire
    # sits at exactly 45 degrees, which lands on a **flat**, not a vertex. Bars a
    # full diameter long put their corners at 1.005 of the radius and they
    # visibly poke out past the rim at all four diagonals. Found by eye in
    # review, and it reads as a second sign interpenetrating the first rather
    # than as an overhang, which is why it is written down here. The existing
    # slash faces never met it: TS131/TS132/TS133 all draw at 0.92.
    TS183:
      plate: disc
      layers:
        - {draw: disc, colour: red, size: 1.00}
        - {draw: disc, colour: blue, size: 0.82}
        - {draw: slash, colour: red, size: 0.95}
        - {draw: backslash, colour: red, size: 0.95}
    # -- P3-22: signs that tell the driver where to go, whose meaning is a shape --
    #
    # 🔴 **These four were refused with the text families and do not belong to
    # them** — Q64 at a second layer. Every row read off TD's own sheet:
    # TS414 is TC 210 on (TS 401 - 505), TS589 on (TS 506 - 600), TS615
    # TC 310 on (TS 601 - 700), TS735 TC 408 / PA 10 on (TS 701 - 805). ⚠️ Not off
    # signCatalogue.json, whose desc calls TS414 "PERMANENT **SPEED** DEVIATION"
    # where the sheet says **SHARP** — the second independent desc error found.
    #
    # ⚠️ **"direction signs" was the heading here and it is not what these are.**
    # TD's own classification, off the sheet titles: TS414 and TS589 are
    # CT174/51-2 TRAFFIC SIGNS (**WARNING**), TS615 is CT174/51-3(1) TRAFFIC SIGNS
    # (**INFORMATORY**), TS735 is CT174/51-3(2) TRAFFIC SIGNS (**SUPPLEMENTARY**),
    # and TD publishes DIRECTION SIGNS as a separate family this block has none
    # of. That matters beyond the label: `rank` IS the sheet class, and three of
    # these were silently defaulting to `regulatory` — which is a stack order, so
    # a NO THROUGH ROAD could sit above a NO ENTRY on a post they share.
    #
    # ⚠️ **TS589 carries NO TC number on the sheet** — 588 and 589 both leave the
    # "(Reg. Fig. No.)" cell blank, unlike every other row here. Written down
    # because a missing number reads exactly like an untranscribed one.
    #
    # PERMANENT SHARP DEVIATION (TC 210): black chevrons on a white board.
    # 🔴 `mirror: true` — which way the chevrons point is DERIVED, not read. See
    # Q66 and `_draw_plate`; TD publishes no left/right pair for a deviation
    # board the way it does TS615/TS616/TS617, so this is the one face here
    # whose orientation the publisher does not give.
    # 🔴 **THIS FACE SHIPPED IN NEGATIVE UNTIL 2026-08-23.** It was authored as
    # black chevrons on a white board. TD's cell is the other way round: a
    # **black** board with the chevrons cut out of it in **white**, which is what
    # TS588/TS589 below already say and what a deviation board looks like on the
    # street. Measured, the sheet's cell is 0.81 black to 0.19 white and the
    # shipped face was 0.23 black to 0.77 white — the largest single disagreement
    # `sign_face_survey.py` found on its first run, and the reason that tool
    # exists. `Q64` again: it rendered perfectly the whole time.
    TS414:
      plate: board_wide
      rank: warning
      mirror: true
      layers:
        - {draw: board_wide, colour: black, size: 1.00}
        - {draw: chevrons, colour: white, size: 0.86}
    # PERMANENT SHARP DEVIATION WITH YELLOW BORDER — the sheet's own words, and
    # "chevron hazard marker" was this project's paraphrase rather than a
    # transcription. The same board with a yellow border and the colours
    # inverted: white chevrons on black. One chevron, because the plate is
    # portrait and `_chevrons` takes its count from the aspect.
    TS589:
      plate: board_tall
      rank: warning
      mirror: true
      layers:
        - {draw: board_tall, colour: yellow, size: 1.00}
        - {draw: board_tall, colour: black, size: 0.84}
        - {draw: chevrons, colour: white, size: 0.68}
    # NO THROUGH ROAD (TC 310). The white T with the red bar laid over its
    # crossbar; TD splits the side-road variants out as TS616/TS617, so the code
    # carries the direction and this face needs no mirror.
    TS615:
      plate: rect_info
      rank: informatory
      layers:
        - {draw: rect_info, colour: blue, size: 1.00}
        - {draw: tee, colour: white, size: 1.00}
        - {draw: tee_bar, colour: red, size: 1.00}
    # ARROWS (TC 408 / PA 10) — the double-headed supplementary plate.
    #
    # 🔴 **"Bordered top and bottom ONLY" was here, and it was wrong.** Re-read
    # off CT174/51-3(2)D at 12x: the TS735 cell carries the SAME full rounded
    # frame as its TS733/TS734 siblings. The earlier reading was taken from a
    # crop wide enough that the side rules of the frame sat outside it, so
    # "no dark column" was a fact about the crop. Q59's rule again — the sheet is
    # authority, and it has to be looked at at a size that can answer the
    # question being asked of it. `bars_h` existed only for this misreading and
    # went with it.
    TS735:
      plate: rect_wide
      rank: supplementary
      layers:
        - {draw: rect_wide, colour: black, size: 1.00}
        - {draw: rect_wide, colour: white, size: 0.88}
        - {draw: arrow_double, colour: black, size: 0.78}

    TS733:
      plate: rect_wide
      rank: supplementary
      layers:
        - {draw: rect_wide, colour: black, size: 1.00}
        - {draw: rect_wide, colour: white, size: 0.88}
        - {draw: arrow_right, colour: black, size: 0.72}
    TS734:
      plate: rect_wide
      rank: supplementary
      layers:
        - {draw: rect_wide, colour: black, size: 1.00}
        - {draw: rect_wide, colour: white, size: 0.88}
        - {draw: arrow_left, colour: black, size: 0.72}

  # ---- the livery ----
  # A city fact, not an art choice: these are the colours the publisher's own
  # sheets print, so they live here rather than in game/tuning/signs.tres (hard
  # rule 3 — the second city's signs are its own).
  #
  # ⚠️ **This is why signs.glb ships COLOR_0 and arrows.glb does not.** An arrow
  # is one paint, so Q53 put its colour in the .tres beside the markings it
  # matches. A sign is four colours on one plate and the whole layer is one
  # draw call, so the colour has to travel on the vertex. The channel is read —
  # signs.gdshader takes COLOR_0 straight to ALBEDO — which is the bar Q54 set
  # when it found COLOR_0.a broadcasting an unread 255 down the road mesh.
  colours:
    red: "#c21a26"
    blue: "#0d4794"
    white: "#f0f0ea"
    black: "#1c1c1f"
    # The plate's back and the pole. Galvanised steel, the same reading P3-19
    # settled for the railings: grey, not green.
    # TS589's border. The one colour here that arrived with P3-22.
    yellow: "#f0c020"
    grey: "#70737a"

  # ---- dimensions, every one of them authored ----
  # ⚠️ **NO SIGN DIMENSION IS PUBLISHED.** Every TS index sheet is stamped "NOT
  # TO SCALE" and notes "Please refer to working drawings for detail dimensions
  # of the traffic sign" — and no working drawing ships in the dataspec bundle.
  # So these are authored to the standard sizes, exactly the debt Q60 recorded
  # for railing height and post pitch, and they are the weakest-evidenced
  # numbers in this block. They are not a position: where a sign goes is read.
  disc_diameter_m: 0.60
  triangle_height_m: 0.68
  # STOP, across the flats. Matched to disc_diameter_m so a STOP reads the
  # same size as the NO ENTRY beside it; TD publishes no dimension for
  # either, and this is Q60's debt at one more plate.
  octagon_height_m: 0.60
  rect_width_m: 0.45
  rect_height_m: 0.60
  # The supplementary arrow plates are landscape where TS182 is portrait.
  rect_wide_width_m: 0.60
  rect_wide_height_m: 0.25

  # ---- P3-22's plates, and where their PROPORTIONS come from ----
  # ⚠️ **Absolute size is still authored — the sheets are NOT TO SCALE — but the
  # aspect is not.** A drawing with no scale still draws a plate the right shape,
  # so the ratio below is measured off the extracted cell's opaque bounding box
  # and only the size is chosen. That is strictly more evidence than Q60's debt
  # had, and it is deliberately not retro-fitted to the plates already shipping:
  # the same measurement says rect_wide should be 1.63 where it is authored 2.4,
  # and moving it would silently re-shape every TS733/TS734 already reviewed.
  #
  # NO THROUGH ROAD (TS615). Cell aspect 1.083.
  rect_info_width_m: 0.60
  rect_info_height_m: 0.55
  # The deviation board (TS414). Cell aspect 3.95 — but the sheet draws three
  # solid chevrons and two outlined, the outline being "repeat as required", so
  # the drawn width is a minimum rather than the sign. Three chevrons at this
  # aspect, which `_chevrons` derives rather than being told.
  board_wide_width_m: 1.20
  board_wide_height_m: 0.40
  # The yellow-bordered deviation board (TS589), which is portrait and carries
  # one chevron. Cell aspect 0.783.
  board_tall_width_m: 0.45
  board_tall_height_m: 0.58

  # Bottom of the lowest plate above the footway. 2.1 m is the standard
  # clearance where pedestrians pass under a sign.
  mount_height_m: 2.10
  # Vertical gap between stacked plates on one pole.
  stack_gap_m: 0.06
  # The pole. Rendered as a prism rather than a cylinder — at 60 mm across, from
  # a car, six sides and twelve are the same picture and one is half the mesh.
  pole_radius_m: 0.032
  pole_sides: 6
  # How far the pole stands proud above the topmost plate.
  pole_headroom_m: 0.05
  # ---- the lettering (P3-20), and the bundle's only texture ----
  #
  # 🔴 **This is where `Texture memory` stops being 0.** One square cell per
  # lettered face, laid in a row, so the atlas is 256 x 256 for the one face that
  # carries words today. `mesh_contract.gd` admits it only because
  # `generated_signs.gd` declares room for exactly this many pixels — Q63's
  # amendment — so raising this number without moving that one fails the build,
  # which is the entire point of the amendment.
  #
  # ⚠️ **256 is chosen against the glyph, not against the budget.** 讓 is 24
  # strokes and occupies rather less than half the cell's height, so it lands at
  # roughly 120 px across; at 128 the strokes merge. A 0.68 m plate is a few tens
  # of pixels on screen at driving distance, so there is nothing to gain above
  # this and the mip chain does the rest.
  text_cell_px: 256
  # 🔴 **A DIFFERENT ARCHIVE from `source` above.** The sign points come from the
  # 218 MB fgdb; the glyphs are cut out of the publisher's index-plan sheets,
  # which ship inside the 8.5 MB dataspec zip the layer's own field spec is read
  # from. Both are already fetched.
  text_source: traffic_aids_data_dictionary

  # Segments in a drawn disc. A 600 mm disc at driving distance is a few pixels
  # across; twelve is already round and twenty-four is twice the mesh.
  disc_segments: 12

  # How far each face layer floats in front of the one beneath it. Coplanar
  # layers z-fight, which is the same reason arrows.lift_m exists — and the
  # plate is vertical here, so this is along the plate normal rather than up.
  #
  # ⚠️ **4 mm was not enough and the failure was easy to misread.** At that value
  # the white bar of a NO ENTRY z-fought its own red disc, and from 4 m it read
  # as an *arrowhead-shaped* wedge — plausible enough to be written off as the
  # 12-gon's facets, which is what happened until a 2.2 m shot settled it. The
  # geometry was correct throughout: the bar is 4 mm in front and the vertex dump
  # said so. Only a close render showed it. 12 mm is clean at every distance
  # tried, and a sign plate is a rendering device here rather than a thickness —
  # the paint on a real plate is coplanar.
  layer_lift_m: 0.018

  # ---- the registration, and why a published position is moved ----
  # 🔴 **77.3% of this region's sign poles are surveyed INSIDE the drawn
  # carriageway** — 540 of 699, a median 1.52 m past the drawn kerb and up to
  # 4.92 m. Not because TD put them there: the ribbon is drawn 1.6x the real
  # carriageway (widen_default), so a pole standing on the real kerb lands in the
  # drawn lane. Drawn where surveyed, three quarters of the city's signs stand in
  # the road, and the player drives through them.
  #
  # ⚠️ **So the position is registered rather than read, and this is the SECOND
  # place in the bundle a published extent is moved** — Q60 called the railings
  # the only one. It is the same measurement (67.9% of railing metres) arriving
  # at a second layer for the same reason, and it is answered the same way:
  # keep the along-edge position and the side, move only the distance across.
  #
  # 🔴 **AND ONLY OUTWARD, since Q78.** Read the paragraph above as what it is:
  # an argument for pushing a post OUT of a ribbon drawn too wide. It says
  # nothing about a post already standing clear, and until 2026-08-26 the rule
  # moved those too — every post was assigned the same offset whatever its
  # surveyed position was. ⚠️ **The split is over a different population from
  # the 540-of-699 above and must not be subtracted from it**: of the 654 posts
  # that reach the registration, measured against the drawn kerb PLUS outset_m,
  # 559 (85.5%) are pushed outward and 95 (14.5%) were being pulled INWARD,
  # toward the carriageway — p50 0.69 m, p90 2.54, max 4.51, with 36 over a
  # metre and 6 over three. No counter could see it because shift_m is an
  # absolute value, so a pull and a push are the same number. Those 95 now keep
  # the point TD surveyed, and signs.json counts them as posts_kept_as_surveyed.
  #
  # How far outside the drawn carriageway edge a post stands. The same 0.6 m the
  # railing classes use, and for the same reason — it is a footway width, not a
  # sign fact. ⚠️ It is also the threshold: a post further out than
  # half_width + outset_m is left alone. Not the bare drawn kerb, which would
  # keep 151 posts but strand 56 of them in the 0-0.6 m gutter band and so stop
  # the rule being monotone.
  outset_m: 0.6
  # ⚠️ THE BAR ON THE REGISTRATION. A pole whose move exceeds this is refused
  # rather than drawn. Chosen against the measured distribution below rather than
  # to admit everything, and signs.json republishes `shift_m` over the poles this
  # refuses so the choice stays checkable (Q58's trap).
  # ⚠️ **Since Q78 it can only ever refuse a PUSH** — a post surveyed clear of
  # the kerb is kept, and a kept post makes no move for the bar to judge. At this
  # region's widths nothing reaches it at all: posts_over_shift is 0.
  max_shift_m: 6.0
  # Two poles closer than this are one post. 🔴 **The published layer has
  # outright coincident poles** — nearest-other-pole reads 0.00 m at both p10 and
  # p25, and 232 of 699 (33.1%) have a neighbour inside 0.6 m — because several
  # GG_NAME groups share one physical post. Drawn separately they interpenetrate
  # and the plates are unreadable. ~/hk-traffic-sign-map meets the same thing and
  # collapses an assembly onto its primary's anchor.
  pole_merge_m: 0.75

  # Furthest a pole may sit from a level-0 centreline and still be drawn. A sign
  # inside a building forecourt or up a footbridge belongs to no street; beyond
  # this it is counted unassigned rather than dragged onto the nearest one. The
  # same bar arrows: and railings: both set, re-measured for this layer:
  # signs.json republishes the gap as `offset_m` on every run.
  max_offset_m: 12.0

  # Furthest a sign may sit from the pole its GG_NAME names before the pair is
  # refused. ⚠️ **Learned from ~/hk-traffic-sign-map, which hit it first**: its
  # compute-stacks.mjs caps a group's span at 15 m because "the 15 m span cap
  # drops pathological GG_NAMEs reused across signs kilometres apart". The same
  # hazard is visible here — signs.json read pole_offset_m p99 16.3 m and max
  # 20.3 m before this existed, against a p50 of 2.0 — so the cap is taken at
  # their number rather than re-derived. signs.json republishes the distribution
  # so the choice stays checkable.
  max_pole_span_m: 15.0

  # 🔴 **Where a banned movement stops being a left turn and starts being a
  # straight-on or a U-turn**, for the diff signs.json publishes as
  # turn_sign_agreed / _disagreed / _unmatched (Q62). The road graph carries 217
  # banned movements and TS131/TS132/TS133 are the signs that say the same thing
  # on a post, so the two sources can be diffed — but only after the graph's
  # movements are classified, because P1-3 reads OTHER_REST_TYPE and never emits
  # it. The class is therefore read off the movement's own geometry.
  #
  # Measured over all 217 published restrictions at these values: 99 right, 80
  # U-turn (60 of them leaving by the edge they arrived on), 34 left, and 4 that
  # pass straight through and so are neither. Every one resolves — no restriction
  # names an edge or a node that is not there.
  #
  # ⚠️ **These classify, they never refuse.** The diff is report-only for Q56's
  # reason — a disagreement is a finding about one of two sources and this stage
  # has no standing to say which — so nothing is dropped or gated on them.
  turn_straight_deg: 30.0
  turn_u_deg: 135.0

# Published yellow box junctions (P3-18, the follow-on Q59 recorded).
#
# Q53 held box junctions because "nothing publishes which junctions have one";
# Q56 found the list on 2026-08-20: DTAD_YL_BOX_POLY publishes each box as a
# surveyed polygon — 20 in this region, 20 m² to 469 m², all at grade. The
# extent is read, never derived: the region has 393 junction nodes against 20
# published boxes, so placement from topology would be wrong 19 times in 20.
#
# ⚠️ **ANGLE1/ANGLE2 — the two hatch directions, 90 deg apart — are published
# on only 4 of the region's 20 boxes.** Where present they are used, converted
# `(90 - ANGLE) mod 360` exactly as arrows converts ANGLE. Elsewhere the
# direction is derived: the box's own min-area-rectangle long axis + 45 deg.
# Graded against the 4 published pairs, folded mod 90 (an orthogonal hatch
# field is invariant under 90 deg): residuals 0.3 / 5.6 / 29.3 / 35.9 deg.
# The alternative — the nearest level-0 edge's heading + 45 — read 7.5 / 9.5 /
# 38.8 / 0.4 and loses per pair 3 to 1; it also picks an arbitrary arm at
# exactly the geometry a box occupies (one elongated east-west box in region
# snaps its centroid to a cross street). boxjunctions.json republishes the
# residual as `hatch_angle_residual_deg` on every run.
boxjunctions:
  source: traffic_aids_drawings_gdb
  layer: DTAD_YL_BOX_POLY
  fields:
    type: YELLOWBOX_TYPE
    level: ELEVATION
    hatch_a: ANGLE1
    hatch_b: ANGLE2

  # The one published value of the region's layer. The filter exists for the
  # second city: a type this stage has no business drawing is refused and
  # counted rather than painted yellow.
  box_types: ["Yellow Box"]

  # Marking convention, transcribed from the index plan CT174/51-5(1)F row for
  # RM1038 (TC 514) BOX JUNCTION - YELLOW: "BOUNDARY LINE WIDTH = 300, HATCHED
  # LINE WIDTH = 100, SPACING = 2000 (2500)". The sheet is a scan with no text
  # layer, read by eye; the parenthetical spacing is the wider variant and the
  # principal figure is what ships.
  border_width_m: 0.3
  hatch_width_m: 0.1
  hatch_spacing_m: 2.0

  # Sampling pitch along stripes and border runs. Every vertex takes its height
  # from the road under it, so this is what lets a stripe follow the crown of a
  # junction instead of chording across it.
  station_m: 2.0

  # ⚠️ Deliberately below arrows' 0.015: 51 of the region's turn arrows sit
  # over junction caps, and an arrow inside a box at equal lift would z-fight
  # the hatching. Arrows paint over boxes, which is also what the street does.
  lift_m: 0.012

  # The boundary line rides this far above the hatch, so the two never share a
  # plane where they cross — the hatch is deliberately not clipped back to the
  # boundary's inner edge, because an inward offset of a concave 106-vertex
  # ring can self-intersect and a repaired offset is invented geometry.
  # 0.012 + 0.002 keeps the border under arrows' 0.015.
  border_lift_m: 0.002

  # Furthest a box centroid may sit from a level-0 centreline and still be
  # drawn. Same bar as arrows, re-measured for this layer: the region's 20
  # centroids snap at 0.2-6.1 m, so 12 admits them all and refuses a box that
  # has drifted onto no road this build drives.
  max_offset_m: 12.0

# Published stop lines and give-way lines (P3-23).
#
# The markings under the GIVE WAY plates P3-20 put 讓 on: 74 posts told the
# player to give way and no line on the carriageway said where. DTAD_RD_MARK_LINE
# publishes all three transverse markings as surveyed polylines — 211 parts,
# 1,673 m in region, every one of them straight (chord over length p50 1.0000)
# and every one at grade (ELEVATION null on all 120 RM1011 and all 83 RM1013;
# 6 of 8 RM1012, the other two on A01).
#
# ⚠️ **THE DIMENSIONS BELOW ARE TRANSCRIBED FROM THE PUBLISHER'S OWN SHEET**,
# TD index plan CT174/51-5(1)F inside dataspec/tadrawings_dataspec.zip, which is
# Q59's rule and it bites hardest here: the sheet is a SCAN. pdffonts returns no
# embedded font and the page is eight indexed 2400-ppi images, so there is no
# text layer to read and the rows below were read by eye off a 600 dpi render.
# Q67 measured what eye-reading a sign face costs — four faces wrong out of five
# — so each row is quoted verbatim rather than paraphrased, and they are three
# lines of plain lettering rather than a pictogram, which is why they survive
# the same treatment the TS faces did not.
#
#   1011 (TC 506)  STOP LINE      LINE WIDTH = 200, MODULE: CONTINUOUS
#   1012 (TC 507)  STOP LINES     LINE WIDTH = 200, LINES SPACING = 300,
#                                 UPPER LINE = CONTINUOUS, LOWER = CONTINUOUS
#   1013 (TC 508)  GIVE WAY LINES LINE WIDTH = 200, LINES SPACING = 200,
#                                 UPPER LINE = 600 MARK, 300 GAP
#                                 LOWER LINE = 600 MARK, 300 GAP
#
# ⚠️ **LINES SPACING is the clear gap between the two lines, not a pitch**, and
# the sheet proves it two rows above: RM1001 DOUBLE LINES publishes LINE WIDTH =
# 150 with LINES SPACING = 100, and two 150 mm lines whose centres are 100 mm
# apart is one 250 mm line. Only the gap reading draws a shape.
#
# 🔴 **THE HOST IS PICKED BY TRANSVERSALITY, NOT BY PROXIMITY.** This is the one
# place this stage departs from arrows: and boxjunctions:, and it was measured
# before it shipped rather than argued. Both of those take the nearest level-0
# edge and both are right to — an arrow sits mid-lane, a box mid-junction. A stop
# line sits at a junction MOUTH, drawn across the minor road while lying a metre
# off the major road's kerb (RM1013 midpoint to nearest centreline: p50 1.10 m,
# p90 3.30). Measured as |90 - angle to host|:
#
#   join              RM1011                        RM1013
#   nearest edge      p50 10.8, over 30 deg 47/120  p50 16.5, over 30 deg 28/83
#   transverse pick   p50  1.8, over 30 deg  5/120  p50  4.0, over 30 deg  8/83
#
#   the two disagree about the host on 53 of 120 and 36 of 83 — 44% and 43%
#
# The extent is published, so a wrong host does not move the paint. It moves the
# HEIGHT, and two arms of one junction disagree about the deck by up to 0.43 m
# where they meet (boxjunctions:), so it is a bar sunk into or floating over the
# asphalt at the one place the player is looking.
#
# ⚠️ **axis_residual_deg grades a rule that optimises the thing it reports** —
# Q58's drawn_gauge_m trap in new clothes — so roadmarks.json publishes
# host_disagreement, chosen against naive-nearest, as the counter that can
# actually see this regress. The residual ships too, recorded over refusals as
# well as keeps, and is worth what that caveat leaves it worth.
# ---------------------------------------------------------------------------
# Traffic signal heads — NOT DECLARED (P3-17, dropped by Q77)
# ---------------------------------------------------------------------------
#
# 🔴 **The block was here and was removed on the user's instruction**, so this
# city ships no signals.glb. The stage, the config loader, the material, the
# verify tool, the preview node and the tests all remain, and all handle an
# undeclared block as a first-class state — declaring it again is the whole of
# the work to bring the layer back. `git show 3787db5` has the block as it
# shipped, and etl/tests/test_signals.py's BLOCK is a live copy of its values.
#
# ⚠️ **The layer was correct and was dropped anyway, which is the part worth
# reading.** It drew 415 heads on the positions TD surveyed, both partitions
# closed, facing_away was 0 and check.sh was green. What it could not do is
# LIGHT UP — and a dark signal head is not a neutral depiction of a signal, it
# is a depiction of one that is out of service, asserted 415 times.
#
# ⚠️ **And a lit one could not be made honest from what this repo knows.**
# Measured before the decision: the nearest graph node to a head is p50 11.5 m
# (max 37.9, and 16 of 132 are `endpoint` nodes rather than junctions); of the
# 107 junctions carrying two or more heads only **18** have a cleanly opposable
# pair of approaches, 29 have every head facing one way, and 32 have three
# directions; and **57 of 137 junctions are partially populated**, because the
# in-carriageway registration refuses 86 posts. So a phase plan would have had
# to invent the junction grouping, the phase grouping, the stage order, the
# timings and the clearance intervals — five layers on top of a facing that is
# itself ungraded (Q62) and a vocabulary nothing defines (Q76) — and it would be
# wrong at roughly four junctions in five, where LIGHTING MAKES THE ERROR
# VISIBLE rather than hiding it.
#
# The route that can be honest is B3: P3-3's traffic needs a phase plan to stop
# at, and the lights then render something real instead of inventing it. See Q77.

road_marks:
  source: traffic_aids_drawings_gdb
  layer: DTAD_RD_MARK_LINE
  fields:
    mark_type: LINETYPE
    # The same structure column arrows:, boxjunctions: and railings: read, with
    # the same reading: a code names a structure and null is the ground. Null on
    # 209 of the region's 211 parts.
    level: ELEVATION

  # Which level-0 edges are CONSIDERED for the host — not how far the host may
  # be. At 20 m every one of the region's 209 at-grade parts finds a
  # candidate, and the chosen host then sits p50 7.23 m (p90 16.78) away for
  # RM1011 and p50 5.11 m (p90 17.55) for RM1013. Far further than an arrow ever
  # is from its edge, and correctly so: a bar across a four-lane mouth starts on
  # the far kerb.
  host_radius_m: 20.0

  # How far the chosen host may sit from square across the marking before the
  # match is refused. arrows.bearing_tolerance_deg's value with its logic
  # inverted — there a symbol must lie along its edge, here across it. Keeps
  # 114 of 120 RM1011 and 75 of 83 RM1013; what it refuses is the tail that is
  # not a transverse bar at all, of which a 56.9 m RM1013 lying 78.8 deg off
  # square is the extreme. ⚠️ It refuses the MATCH and never rotates the bar
  # onto the road, which would be an invented marking in Q54's sense.
  bearing_tolerance_deg: 30.0

  # Degrees of angular error one metre of extra distance is worth, for the tie
  # between two candidates equally square across the marking. Small on purpose:
  # at 0.05 it takes 20 m of extra distance to overturn one degree, so this
  # breaks ties and never decides a host.
  proximity_weight_deg_per_m: 0.05

  # Pitch a drawn line is stationed at along its length. Every station takes its
  # own height from the road under it, so this is what lets the region's longest
  # drawn bar — 32.37 m — follow the crown of a wide street instead of chording
  # across it. ⚠️ Not the 33.8 m RM1011: that one is refused as transverse to
  # nothing, so it is not an example of anything this value does.
  station_m: 2.0

  # ⚠️ **Above arrows' 0.015, and the order is a legibility call.** A stop line
  # is the boundary the player must not cross; an arrow is an instruction they
  # have already read by the time they reach it. So where the two overlap the bar
  # wins — the same shape of argument boxjunctions.lift_m makes for putting
  # arrows over box hatching, and a clear 1 mm rather than a hair, because the
  # engine re-quantises Y on import too.
  lift_m: 0.016

  marks:
    # ⚠️ No `lines_spacing_m`: a single line has no gap to declare, and the
    # loader only reads one where there is a second line for it to sit between.
    - id: stop_line
      codes: [RM1011]
      line_width_m: 0.2
      lines: 1

    # ⚠️ **NOT in the original scope, and adding it was the cheap half of the
    # decision.** RM1012 is the same object drawn double — 8 features, 6 at
    # grade — and it costs the RM1013 two-band machinery with the module left
    # continuous. Leaving it out would have given eight junctions no stop line
    # while their neighbours got one.
    - id: stop_lines
      codes: [RM1012]
      line_width_m: 0.2
      lines: 2
      lines_spacing_m: 0.3

    # ⚠️ **A double BROKEN line, and not triangles.** The give-way triangle is a
    # different marking on a different row; TC 508 is two dashed lines, and the
    # sheet's own words are quoted above.
    - id: give_way_lines
      codes: [RM1013]
      line_width_m: 0.2
      lines: 2
      lines_spacing_m: 0.2
      mark_m: 0.6
      gap_m: 0.3

# Pedestrian railings, drawn as their own geometry (P3-19, Q60).
#
# ⚠️ THIS IS THE ONE BLOCK IN THIS FILE WHOSE VOCABULARY THE PUBLISHER DOES NOT
# DEFINE. Every other coded field here is transcribed from a published sheet:
# the RM marking codes from TD's index plan CT174/51-5(1)F, the TS sign classes
# from the TS sheets, the iB1000 feature codes from LandsD's dictionary. For
# DTAD_RAILING_LINE there is nothing. The fgdb data specification gives LINETYPE
# the description "Line Type" and stops; the index-plan bundle's two
# "Miscellaneous Details" sheets — CT174/51-6(1)E and 6(2)F — are sign
# pictograms and lettering, checked by eye, with no railing row on either. So
# the list below is a whitelist read off the code strings themselves, which is
# the weakest claim anywhere in this file, and it is recorded as such rather
# than dressed up. See DATA_SOURCES.md and DECISIONS.md Q60.
#
# In region, 1,753 features / 1,763 parts / 20,273 m over NINETEEN LINETYPE
# values — DATA_SOURCES.md listed four until Q60:
#
#   CRAIL1  10,499 m   CRAIL2  2,921 m   HCAIL2  2,073 m   CBARRIER 1,369 m
#   SOLID      511 m   AMT1      502 m   RAIL1     472 m   AMT        457 m
#   CRASHGATE  301 m   bollard0  285 m   RAILING1  283 m   bollard2   235 m
#   bollard3   153 m   AMT2_1.5  118 m   EAG 3      46 m   MSB 5       23 m
#   AMT1.5_1.0  17 m   AMT-1.5     4 m   bollard1    3 m
railings:
  source: traffic_aids_drawings_gdb
  layer: DTAD_RAILING_LINE
  fields:
    line_type: LINETYPE
    # The same structure column arrows: and boxjunctions: read, with the same
    # reading: a code names a structure and null is the ground. 1,737 of the
    # region's 1,753 features are null and 16 carry A01.
    level: ELEVATION

  # ---- the join, kerbside.py's parameters and its reasons ----
  # Shared by every class below, because it is one join onto one set of kerbs.
  # Pitch the source lines are sampled at, and the cell two overlapping features
  # collapse into. Finer than kerbside's because this layer is finely chopped:
  # 1,763 parts, median 4.6 m, tenth percentile 1.0 m.
  sample_m: 1.0
  # Furthest a sample may sit from a level-0 centreline and still belong to it.
  # A railing round a plaza or up a footbridge belongs to no kerb; beyond this
  # it is counted unassigned rather than dragged onto the nearest street.
  max_offset_m: 12.0
  # ⚠️ THE BAR ON THE REGISTRATION. A run whose move onto the drawn kerb exceeds
  # this is refused rather than drawn. Chosen against the measured distribution
  # of that move over the whole region, before the stage shipped:
  #
  #   0.0-0.5 m   9.4%      3.0-5.0 m  15.9%
  #   0.5-1.0 m  13.5%      5.0-10  m  10.6%
  #   1.0-2.0 m  27.0%      over 10 m   7.5%
  #   2.0-3.0 m  16.1%
  #
  # 3.0 keeps two-thirds of the metres. Above it the "railing" is not a kerb
  # railing at all — it is a plaza edge, a footbridge balustrade or a stair
  # rail — and moving one of those onto a carriageway edge would be inventing a
  # fence rather than relocating one. railings.json publishes the whole
  # distribution, over refusals as well as keeps, so this stays checkable.
  max_shift_m: 3.0

  # ---- the classes, and every figure in them authored ----
  #
  # ⚠️ THIS TABLE SPLITS THE LAYER BY CLASS OF OBJECT AND NEVER WITHIN ONE.
  # LINETYPE has no published domain (Q60) and the layer's other 40 columns are
  # cartography, not description — SYMBOL_SIZE_* is the spec's own "symbol size
  # of marker symbol", in inches on paper; COLOR is an undomained pen index;
  # LINE_WIDTH_* is null throughout. So a class is admitted on the strength of
  # its code strings, exactly as the old single whitelist was, and no class
  # claims an internal difference: all five fence codes draw ONE fence, because
  # nothing published says CRAIL1 differs from HCAIL2 and Q54 debits that
  # invention.
  #
  # ⚠️ Everything the layer refuses is still counted and reported per code, which
  # is what keeps this table an argument rather than an assumption. What is left
  # out and why:
  #   AMT, AMT1, AMT-1.5, AMT1.5_1.0, AMT2_1.5   1,099 m — the numeric suffixes
  #     LOOK like dimensions and that is a guess, which is the one thing Q60
  #     refused to do. Out until something published says otherwise.
  #   SOLID                                        511 m — undomained, and the
  #     one code whose name describes the shape the fence used to be drawn as.
  #   EAG 3, MSB 5                                  69 m — undomained, and
  #     between them a third of a percent of the layer.
  #
  # ⚠️ The flyover parapet is NOT here and is not a class: 1,579 m of on-structure
  # CRAIL1 is refused by ELEVATION before the join, because ribbons() builds
  # level-0 edges only (Q15). Drawing it needs level-aware assignment, which is
  # its own task.
  classes:
    # Hong Kong's signature street railing. Unchanged from P3-19 in every
    # figure — this class IS the old block, and its id is still `railings` so
    # the mesh name, the material name and tuning/railings.tres all hold.
    - id: railings
      line_types: [CRAIL1, CRAIL2, HCAIL2, RAIL1, RAILING1]
      # A break shorter than a car is not a break in a fence, and a run shorter
      # than a car is a post rather than a fence.
      bridge_gap_m: 4.0
      min_run_m: 4.0
      # Pitch the drawn fence is stationed at. Each station takes its height
      # from the ribbon, so this is what lets it follow the camber of a street.
      # ⚠️ NOT the baluster or post pitch — those are the shader's, in
      # tuning/railings.tres, because that is where they are expressed.
      station_m: 2.0
      # ⚠️ AUTHORED, not read. Hong Kong's pedestrian railings stand about chest
      # height on the footway.
      height_m: 1.1
      # The foot sinks this far below the ribbon it stands on. The kerb is
      # flattened for mountability and the ground is a separately decimated
      # surface, so anything planted exactly at road height shows daylight under
      # it wherever the two disagree.
      base_sink_m: 0.25
      # Just past the 0.5 m kerb strip roads.surface draws, so the fence is
      # behind the kerb rather than on the lane the player drives in.
      outset_m: 0.6

    # Posts, not fences — which is why they were refused outright until Q61
    # gave them somewhere to go rather than a fence to be drawn as.
    #
    # ⚠️ min_run_m 1.0 IS THE WHOLE REASON THE RUN PARAMETERS ARE PER CLASS.
    # Bollard features have a median published length of 1.00 m and 84% are
    # under 4 m, so the fence's min_run_m of 4.0 refuses all but a handful and
    # reports it as a clean tally of short-run refusals. One sample cell is a
    # bollard; a 4 m bar would have been a silent decision to draw none.
    - id: bollards
      line_types: [bollard0, bollard1, bollard2, bollard3]
      # Shorter than the fence's, because a gap between two rows of bollards is
      # a real gap — a crossing, a vehicle entrance — far more often than a gap
      # in a railing is. What this bridges is still published as metres_bridged.
      bridge_gap_m: 2.0
      min_run_m: 1.0
      # Finer than the fence's so a 1 m run still takes its height from the
      # ribbon at both ends rather than chording.
      station_m: 1.0
      # ⚠️ AUTHORED. A Hong Kong footway bollard stands about hip height. Note
      # that this is the one dimension a source COULD have carried and does not:
      # SYMBOL_SIZE_1 is null on 0 of 196 bollard features here, and is a plot
      # size in inches where it is populated at all.
      height_m: 0.85
      base_sink_m: 0.25
      outset_m: 0.6

    # Vehicle restraint. CBARRIER (1,369 m) and CRASHGATE (301 m) read as
    # restraint rather than pedestrian railing, and P3-19 refused them rather
    # than draw them as the same fence — Q54's debit. They are in now as their
    # OWN class, which is the form of the claim the code strings support: not
    # "these are railings" but "these are a different thing".
    - id: barriers
      line_types: [CBARRIER, CRASHGATE]
      bridge_gap_m: 4.0
      min_run_m: 4.0
      station_m: 2.0
      # ⚠️ AUTHORED. Lower than a pedestrian railing and heavier: a barrier is
      # built to stop a vehicle, not to keep a person off the carriageway.
      height_m: 0.9
      base_sink_m: 0.25
      outset_m: 0.6

# ---------------------------------------------------------------------------
# Lamp posts (P3-26) — iB1000 `UtilityPoint`, `UTILITYPOINTTYPE = LPO`.
# ---------------------------------------------------------------------------
#
# ✅ **The only street-furniture vocabulary in this file the publisher actually
# defines.** `LPO - Lamp post` is a coded-value domain stored *inside* the
# geodatabase, readable out of every sheet's `.gdbtable` bytes. `railings.classes`
# is a whitelist read off code strings because `LINETYPE` has no domain (Q60) and
# `signals.head_prefixes` was the same (Q76); this is a selection from an answer
# the publisher wrote down, and a wrong entry here is checkable against the source.
#
# ⚠️ **The layer publishes a position and nothing else.** Six columns, not one of
# them a length: no height, no arm, no lantern, no angle, no elevation level.
# Geometry Z is 0.0 on all 1,263 — the file's convention, not a defect, since
# `SpotHeight` reads 0.0 too and keeps its value in a column this layer lacks. So
# **every dimension below is authored**, which is Q60's railing debt and P3-16's
# plate debt at a fourth and fifth layer. None of them is a position.
#
# ⚠️ **These sheets are already on disk** for the podium join, so this layer costs
# no fetch at all — the same free lunch Q57 found for the tramway.
#
# Measured over the region (P3-26):
#
#   in region                     1,263 LPO   (FWH 215, SWH 26, EPO 2 — not drawn)
#   nearest-neighbour spacing     p10 7.09  p50 16.74  p90 27.63  max 55.46 m
#   coincident pairs (<0.05 m)    0        <- why there is no assembly clustering
#   surveyed inside drawn ribbon  810 / 1,263 (64.1%), p50 1.46 m past the kerb
#   drawn at max_shift_m 3.0      924 (73.2%)   over_shift 211   in_carriageway 128
#   drawn at max_shift_m 6.0      992 (78.5%)   over_shift   7   in_carriageway 264
#
# 🔴 **3.0 rather than signs' 6.0, and the sweep above is the argument.** Going to
# 6.0 converts 204 over-shift refusals into pushes — and 136 of them then land in
# another edge's ribbon and are refused anyway, so it buys **68 posts for a 6 m
# lateral move**. That is `signs.py`'s "a post on the wrong street", and a lamp
# column is 10 m tall and part of a regular row, so a mis-registered one is more
# visible than a mis-registered sign rather than less.
#
# ⚠️ The sweep above is measured with a scratch host; the stage's own join adds
# `too_far` and `no_ribbon`, so it ships **897** rather than 924. `lamps.json` is
# the live count and these are the shape of the trade.
lamps:
  source: topography
  member: "{tile}/{tile}.gdb"
  layer: UtilityPoint
  fields:
    kind: UTILITYPOINTTYPE
  # ✅ Read off the published domain, not off the code strings. The other three
  # codes in this domain are hydrants and one electricity pole; `lamps.json`
  # publishes `refused_by_kind` over all of them so the selection is reviewable.
  kinds: [LPO]

  # 🔴 **A NAMED MATERIAL, NOT AN AUTHORED HEX — and `signs.colours`' exemption
  # from Q33 deliberately does NOT transfer here.** That exemption rests on two
  # things: a sign's livery is a *printed specification* with no reflectance to
  # grade, and a plate is four colours inside one draw call so the values must
  # ride COLOR_0. Neither holds for a lamp post. Galvanised steel is a real
  # surface with a published albedo, which is exactly what `materials:` is for,
  # and there is **one** colour here. `tramway.rail_material` is the pattern;
  # `_check_exposure` grades the entry.
  #
  # ⚠️ **One material, and `config.py` refuses a second.** The layer publishes no
  # lantern type and no material of its own, so two liveries would assert a
  # distinction the publisher does not draw (Q54) — Q60's "five codes draw one
  # fence" again.
  column_material: galvanised_steel

  # ---- the column, authored ----
  # HyD's standard urban column is 8-12 m to the lantern; 9.0 sits mid-range and
  # is what the region's dual carriageways want. ⚠️ Authored, and there is no
  # published number to check it against.
  column_height_m: 9.0
  # ⚠️ **The CIRCUMRADIUS**, so a hexagon's flat sits at 0.078 m — 13% inside
  # this number. Stated because a reader checking it against a published
  # diameter would otherwise be wrong by that much.
  column_radius_m: 0.09
  # Six, matching `signs.pole_sides`. ⚠️ **The triangle count is 897x whatever
  # this is** — at 6 sides a lamp is 40 triangles and the whole layer lands at
  # 35,880, against the road surface's 32,233. Raising it to 8 costs ~5k
  # triangles for a silhouette nobody reads at 50 kph.
  column_sides: 6

  # ---- the bracket arm and lantern, authored ----
  # The arm reaches over the carriageway — see `lamps.py` for why that direction
  # is *derived* and ungraded (Q62), and what grades it instead. It **slopes**
  # down to the lantern rather than running flat: a horizontal arm plus a
  # separately-dropped housing leaves the lantern floating.
  arm_reach_m: 1.6
  arm_radius_m: 0.06
  arm_drop_m: 0.5
  lantern_length_m: 0.8
  lantern_width_m: 0.32
  lantern_depth_m: 0.16

  # ---- the join ----
  # A post further than this from any level-0 centreline has no host, so no kerb
  # side and no arm direction. 12 m is `signs.max_offset_m`'s value and its
  # reason: a little over the widest drawn half-width in the region.
  max_offset_m: 12.0
  # Where a registered column stands, measured out from the drawn kerb. Matches
  # `signs.outset_m`; a column is a fatter object than a sign post but it stands
  # in the same footway.
  outset_m: 0.6
  # 🔴 See the sweep above. Q78's outward-only clamp applies — `lamps.py` says why
  # this follows `signs.py` and not `signals.py`/`railings.py`.
  max_shift_m: 3.0
  # Posts the registration pushed onto one point. ⚠️ **Small, and it must stay
  # under `max_shift_m`** (refused at load): this layer publishes zero coincident
  # pairs, so every fold here is one the move made, and a wide radius would thin a
  # row whose regularity is the whole reason for drawing it.
  merge_m: 0.75
  # 🔴 **Report-only, and this layer's own failure mode.** A missing sign is
  # invisible; a missing lamp in a regular row is a hole. Surveyed, the region has
  # 5 neighbour gaps over 40 m; drawn, it has 16. A widening change moves that
  # number and nothing else would show it.
  gap_report_m: 40.0

# Hero buildings shipped as authored models (P3-6) — the landmarks.json
# contract in docs/ARCHITECTURE.md. The building stage excludes every stem
# named in `replaces_source_ids` from the tile meshes; export.py converts each
# `pos` to game space and writes the shipped document.
#
# ⚠️ `replaces_source_ids` holds *stems* — DATA_SOURCES.md's cross-dataset
# building key (the source id minus its variant suffix), the same key the
# facade survey and P3-7a's override table join on. A stem that matches no
# source mesh fails export validation, both directions.
#
# ⚠️ `pos` is projected CRS (easting/northing, metres) with elevation in mPD —
# the numbers are checkable against the sheets by eye. `rot_y_deg` is a compass
# bearing, 0 = north rising eastward, per CityManifest.bearing_deg.
#
# Names are display names for HUD/credits use — never rendered signage (Q42,
# hard rule 8).
landmarks:
  # Phase 2 island wing + atrium link only. The Phase 1 podium south of Harbour
  # Road is a different stem (B358611580502063) carrying four separately-named
  # towers above it — all stay generated. Discovered 2026-08-12 from 11-SW-9D:
  # iB1000 block 1103124251 (base 3.6 / roof 70.3 mPD, CERTAINTY 1), 3D-BIT
  # mesh footprint 201 x 349 m, top 71.9 mPD, single mesh, no sheet-edge dupes.
  #
  # Mesh-sourced (`source_paint` below): the shipped model is the source mesh
  # itself, extracted and vertex-repainted by `pipeline/landmarks.py` — the
  # generated hero the P3-6 review rounds converged on, after the user judged
  # the source closer to the Expo Drive East photos than the generator's
  # massing. Generated output under government terms; never committed.
  - id: hkcec
    asset: "res://assets/generated/landmarks/hkcec.glb"
    pos:
      easting: 835867.5 # base-band footprint centroid of the excluded mesh
      northing: 816041.0
      elevation: 4.0 # mesh base 3.99 mPD; sits on terrain the tiles agreed with
    # The mesh keeps its source orientation, so no bearing: the 6.4 PCA figure
    # retired with the generated massing it oriented.
    rot_y_deg: 0.0
    name:
      en: "Convention Centre"
      zh: "會展"
    replaces_source_ids: [B358761603301063]
    # Measured 99,577 after slicing (41,273 in the source; the growth is the
    # walls being cut at every ribbon edge — crisp vertex-colour bands cost
    # exactly those edges), plus ~20% headroom for source-data revisions.
    triangle_budget: 120000
    source_paint:
      materials: { wall: panel_pale, ribbon: curtain_glass, roof: roof_grey, base: concrete_pale }
      # Measured off the street views by pixel profile (six sampled columns:
      # dark share 0.27-0.37, 9-10 bands over ~45 m of hull): storey lines at
      # constant absolute elevations, cut off one by one as the roofline
      # descends — the derivation P3-6 records.
      ribbons: { first_m: 15.0, pitch_m: 4.8, thickness_m: 1.5, count: 10 }
      # The generator's podium band: below it everything paints as base
      # concrete regardless of facing (service base, tunnel piers, deck edge).
      base_below_m: 8.0
      # The building's own aerial photo (the individualised `A0` variant of
      # the same mesh) vetoes procedural ribbons where the elevation carries
      # no glazing — the roof sweeps and fasciae read uniform in the photo,
      # so the bands stop at the eave the way the real ones do. Needs
      # sources/individualised/11-SW-9D.zip on disk.
      reference_texture: true

  # iB1000 block 1103126797 (base 3.9 / roof 380.7 mPD, CERTAINTY 1, no P
  # block — DATA_SOURCES.md); 3D-BIT mesh footprint 78.6 x 82.9 m, top
  # 378.5 mPD. The footbridge touching the podium is INFRASTRUCTURE class and
  # a different stem; it stays generated.
  - id: central_plaza
    asset: "res://assets/authored/landmarks/central_plaza.glb"
    pos:
      easting: 835930.5
      northing: 815683.0
      elevation: 4.0
    rot_y_deg: 143.1 # triangular plan's major axis; refine in the art pass
    name:
      en: "Central Plaza"
      zh: "中環廣場"
    replaces_source_ids: [B359321570101063]

# How P1-3 turns Road Network v2 into a drivable graph.
#
# The `fields:` maps below exist because column names are the Transport
# Department's schema, not a fact about roads (hard rule 3). The pipeline asks
# for a role — "the travel direction" — and this file says which column holds it.
# Every value is verified in docs/DATA_SOURCES.md against the published data
# specification shipped in `road_data_dictionary`.
roads:
  source: road_network_gdb

  centrelines:
    layer: CENTERLINE
    fields:
      # Ordinal grade-separation level, not a height. See elevation_levels.
      elevation: ELEVATION
      travel_direction: TRAVEL_DIRECTION
      # Unique per centreline in the published data, which is what lets the
      # speed-limit and bus-lane layers below join by key rather than by
      # linear referencing along a route.
      route: ROUTE_ID
      name_en: STREET_ENAME
      name_zh: STREET_CNAME

  turns:
    layer: TURN
    fields:
      first_edge: EDGE1FID
      first_end: EDGE1END
      second_edge: EDGE2FID

  speed_limits:
    layer: SPEED_LIMIT
    fields:
      route: ROAD_ROUTE_ID
      # Text with units, e.g. "70 km/h".
      speed_limit: SPEED_LIMIT

  bus_lanes:
    layer: BUS_ONLY_LANE
    fields:
      route: ROAD_ROUTE_ID

  # No-stopping restrictions (`P3-13`, closes `Q54`). ⚠️ **This layer does not
  # join by key.** SPEED_LIMIT and BUS_ONLY_LANE above carry ROUTE_ID, which is
  # unique per centreline; NSR carries ST_CODE_1..6 — the *street* codes it runs
  # along, and a street is many centrelines. So the join is geometric, and
  # `pipeline/kerbside.py` is where it lives.
  kerbside_restrictions:
    layer: NSR
    fields:
      vehicle_type: VEHICLE_TYPE
      time_zone: TIME_ZONE

    # Data specification: 1 = all motor vehicles, 2 = taxis, 3 = PLBs,
    # 4 = goods vehicles, 5 = others.
    #
    # ⚠️ **Only 1 is a painted line.** A restriction on taxis, minibuses or
    # goods vehicles is posted on a sign; painting it on the kerb would assert
    # on the road something the source puts on a pole. That is 33,074 m of the
    # region's 44,220 m — the population `Q54` measured before this field was
    # read, which is why its over-paint figure was 3x rather than the real 4.0x.
    #
    # ✅ **5 "Others" was refused until `Q56`, and it is paint.** `P3-13`
    # refused it because the specification names no class — verified again on
    # the cached `rdnet_dataspec`, which really does say only "5 – Others" — and
    # asserting a restriction on an unnamed class was the invention `P3-13`
    # existed to remove. What settled it was a *second* source rather than a
    # re-reading of this one: the Transport Department's Traffic Aids Drawings
    # v2 draw the restriction lines as they are painted, and **93.9% of this
    # region's code-5 metres carry one** (7,910 m of 8,422 m), 96% of them the
    # single-yellow `RM1041`. The class stays unnamed; what is now known is that
    # TD paints a line there, which is the only question this stage asks.
    # `tools/kerbside_source_audit.py` is that measurement, repeatable.
    #
    # ⚠️ **2, 3 and 4 stay refused, and the same drawing is why the reason had
    # to change.** "A restriction on taxis, minibuses or goods vehicles is a
    # sign" is not what the drawings show — code 2 is 100% covered by a painted
    # line and code 4 is 90.2%. They stay out because a *class-specific*
    # restriction is not a plain yellow line and this codec has no way to say
    # which class: painting one as an ordinary double yellow would assert on all
    # motor vehicles what the source restricts for goods vehicles. That is a
    # codec limit, not a fact about the road, and it is 2,847 m in region.
    painted_vehicle_types: [1, 5]

    # Data specification: 1 = 24 hours, 2 = 8-10 am and 5-7 pm, 3 = 7 am to
    # 7 pm, 4 = 7 am to midnight, 5 = others. Hong Kong's road rule is the plain
    # one — a 24-hour restriction is a double yellow, a posted-hours one a
    # single. In region: 27,118 m double against 5,956 m single.
    #
    # Every code the layer can carry is listed, because an unlisted one raises
    # rather than defaulting. EFFECTIVE_DAY is published too and is uniformly 1
    # ("all days") across every code-1 feature in region, so it distinguishes
    # nothing here and gets no field.
    kinds:
      1: double
      2: single
      3: single
      4: single
      5: single

    # Pitch the restriction lines are sampled at, which is the resolution of
    # every published run and the cell two overlapping features are deduped
    # into. A metre is well under the shortest restriction worth drawing and
    # well over the millimetre the geometry is published at.
    sample_m: 1.0
    # Under a car length, so a break this short is not a place a car can stop.
    # The source draws plenty of them: a vehicle crossing digitised as a gap,
    # two features meeting with a hair between them.
    bridge_gap_m: 3.0
    # Below this a run is sampling noise on a bend rather than a length of kerb.
    min_run_m: 5.0
    # ⚠️ Not a tuning value — the guard that says "this restriction belongs to a
    # road this region does not contain", and the search radius with it.
    # Measured against the region: offsets run to a median 2.76 m, p99 8.24 m
    # and a worst 17.83 m, so this binds on nothing here today. It is written
    # down so that when it does bind, it binds on something absurd.
    max_offset_m: 20.0

    # The second opinion (`Q56`). **Not read by the pipeline** — only by
    # `tools/kerbside_source_audit.py`, which runs the block above's join over
    # this layer instead and diffs the two answers.
    #
    # `DTAD_RST_ZONE_LINE` is the same restrictions drawn cartographically:
    # where `NSR` says *what is restricted, for whom, when*, this says *what is
    # painted, in what linetype*. That is why it can grade the kind, which
    # nothing else in the repo can see — and why it cannot replace `NSR`, whose
    # `TIME_ZONE` it carries as a column that is **null on all 1,763 features in
    # this region**.
    #
    # The two marking codes are the Transport Department's own, defined in the
    # index plan shipped inside the dataset's `dataspec` zip:
    #   RM1040 (TC 515) — "NO STOPPING AT ANY TIME - YELLOW", left line
    #                     continuous + right line continuous = a double yellow
    #   RM1041 (TC 519) — "NO STOPPING PART TIME - YELLOW", module continuous
    #                     = a single yellow
    # Codes outside this table are refused by the tool rather than defaulted,
    # for the same reason `kinds:` above lists every code it can meet. In region
    # that leaves 196 m of `SOLID` and null linetype out of 39,292 m.
    audit:
      source: traffic_aids_drawings_gdb
      layer: DTAD_RST_ZONE_LINE
      fields:
        line_type: LINETYPE
      kinds:
        RM1040: double
        RM1041: single

  # Data specification: 1 = travel permitted in both directions (default),
  # 3 = permitted only in the digitised direction of the line feature.
  travel_directions:
    1: both
    3: forward

  # EDGE1END: "Y" means the turn passes through the end of the first edge,
  # "N" through its beginning.
  turn_at_end_value: "Y"

  # The source's null sentinel for text fields. Compared after Unicode
  # normalisation and dash folding, so this one entry also catches the
  # full-width and en-dash spellings the Chinese name field actually uses.
  null_values: ["-99"]

  # Hong Kong signs speed limits only where they differ from the 50 km/h urban
  # default, so the SPEED_LIMIT layer covers under 10% of the region's edges —
  # all of them 70 or 80 km/h expressway. The default belongs here rather than
  # in code because it is a national road rule, and the second city's differs.
  default_speed_limit_kph: 50

  # Douglas-Peucker tolerance for centreline geometry. Not cosmetic: one
  # 51.7 m centreline in the region ships 54,330 vertices — a median segment
  # length of 0.4 mm — and five edges hold three quarters of the region's
  # vertices. At 0.2 m the shape is preserved to well under a lane marking.
  simplify_tolerance_m: 0.2

  # Centrelines are cut at the region boundary, and a feature that merely clips
  # a corner leaves a stub behind. Two metres is under the shortest real
  # centreline in the region (2.6 m) and over any stub worth keeping.
  min_edge_length_m: 2.0

  # ⚠️ Lane counts are NOT published. Verified against every field of every
  # layer in the data specification: Road Network v2 has no lane attribute.
  # These are authored defaults, keyed on the one thing that does correlate —
  # a signed limit above the urban default marks an expressway. P1-4 applies
  # the playability widening (~1.3-1.8x) on top; see docs/GAME_DESIGN.md.
  lanes_default: 2
  lanes_by_min_speed_limit_kph:
    70: 3

  # 🔴 **The product of these two is 6.4 m, and that is below every carriageway
  # width Hong Kong permits.** TD's Transport Planning & Design Manual Vol 2
  # Table 3.4.2.1 (March 2026) gives a minimum two-lane single carriageway of
  # **7.3 m** and allows 6.75 m only *per direction* of a dual carriageway. So
  # the authored width is not merely underived — it is outside the published
  # range, on 720 of the region's 737 edges. `Q95`.
  #
  # ⚠️ **3.2 m is inside the published *lane* range and below the table's own
  # arithmetic.** TPDM 4.3.9.8 puts a through lane at **3.0-3.65 m**; the
  # carriageway table implies 3.375 m for distributors (13.5/4, 10/3, 6.75/2)
  # and 3.65 m for trunk roads (14.6/4). 3.2 is legal and small. It is left
  # alone deliberately: raising it moves every ribbon in the region, which is
  # `Q95`'s decision and not a number to change in passing.
  lane_width_m: 3.2

  # Hand-authored. These are the streets the Hong Kong Tramways route uses
  # inside the region, including the Happy Valley branch. docs/GAME_DESIGN.md
  # treats trams as the highest-leverage single object in the game, so this
  # list earns the attention; it does not earn being invented.
  #
  # ⚠️ This block used to say "no dataset marks tram tracks". That was wrong,
  # and Q57 corrected it on 2026-08-20. iB1000 publishes tramway centrelines —
  # CartoTransLine, TRANSPORTATIONLINETYPE = TW, "Tramway" in LandsD's own data
  # dictionary, 168 parts over the six sheets this region already downloads —
  # and RailwayPolygon carries the same extent as 62 polygons. Traffic Aids
  # Drawings adds the RM1034 TRAM LANE lettering and the RM1045/RM1046 stop
  # markings, and CSDI publishes 19 tram stops inside the region.
  #
  # ⚠️ Sourcing it is not a one-line swap, which is why this list still stands.
  # A tram line has no street name of its own, so it reaches one through a
  # nearest-centreline join, and a naive join lands 35 samples on MARSH ROAD
  # and 16 on CANAL ROAD FLYOVER — the flyover is above the track it matches.
  # The list below is not shown wrong by any of that. What was wrong was the
  # claim that nothing could check it. See docs/DECISIONS.md Q57.
  tram_streets:
    - JOHNSTON ROAD
    - HENNESSY ROAD
    - YEE WO STREET
    - CAUSEWAY ROAD
    - PERCIVAL STREET
    - RUSSELL STREET
    - WONG NAI CHUNG ROAD

  # How P1-4 draws the graph as a ribbon. Art direction and playability, not
  # anything the source says — see docs/ART_DESIGN.md "Roads".
  surface:
    # docs/GAME_DESIGN.md fixes the widening range at ~1.3-1.8x: real Wan Chai
    # street widths are unforgiving at arcade speeds. Measured consequence, and
    # the reason 1.6 was picked over 1.3: the region's six opposed carriageway
    # pairs sit 1.49-6.82 m apart, and at 1.6x every one of them overlaps into a
    # single continuous surface. At 1.0x the widest pair leaves a 0.42 m slot
    # down the middle of Lockhart Road.
    # 🔴 A FLOOR in metres since Q95, not a multiplier on width_m. It was a
    # multiplier while every width_m was the same invented 6.4 m; against a
    # MEASURED width a multiplier is the wrong shape, because it over-widens the
    # streets that are already wide and under-widens the narrowest. What
    # GAME_DESIGN.md asks for is a minimum, and this is that minimum.
    #
    # ⚠️ 10.24 is exactly what the old 6.4 x 1.6 drew, so on an authored width
    # this rule is INERT and the whole re-baseline is confined to the streets the
    # survey found wider than it. That is what made the change affordable, and
    # it is the ratchet: the floor landed on its own first and moved no byte.
    floor_default_m: 10.24
    # Expressways are already drawn wide by their three lanes, and lifting them
    # to the same floor pushes the deck through the buildings beside it. 12.48 is
    # what 9.6 x 1.3 drew.
    floor_by_min_speed_limit_kph:
      70: 12.48
    # Structure is drawn at its authored width, because both arguments above are
    # at-grade arguments and neither survives the trip onto a deck. The slot
    # argument: at grade a gap between opposed carriageways shows the void where
    # unshipped terrain would be, but on a flyover it shows the deck, which P2-7
    # put under the ribbon and which the tiles do ship. The room-to-drive
    # argument: a viaduct is a parapet-to-parapet fixed width in the real city,
    # and a driver reads the guardrail as the edge whatever the asphalt does.
    # Measured on Wan Chai, sampling the ribbon across its full drawn width on a
    # 2.0 x 0.5 m grid and counting a cell as supported when INFRASTRUCTURE has
    # an upward face within +/-1.0 m: 20.1% of off-grade carriageway hung in air
    # before, 10.2% after, and the drawn area fell 31%. The remainder is a
    # separate defect and no width rule reaches it — Q22.
    # 0.0 is "draw it at its own width" — the floor's way of saying what the
    # 1.0x multiplier used to say, and the same measured argument stands.
    floor_by_elevation_level:
      1: 0.0

    # Q23. The rule above is keyed on the edge, and a road does not become a
    # bridge at an edge boundary: P2-7 lifted 16 level-0 edge ends onto the
    # ramps they physically sit on, which left 1,070 m of level-0 centreline
    # across 28 edges standing on structure at the full 1.6x — worst at the WAN
    # CHAI INTERCHANGE approaches (94, 94, 78 m) and HUNG HING ROAD FLYOVER
    # (72 m). Not a tail: every metre of it was widened. Reported from the
    # driver's seat before it was measured. Same value as the level rule and for
    # the same reason — a deck ends at a parapet — but applied per station,
    # where roads.py publishes `on_structure`.
    floor_on_structure_m: 0.0
    # How much of the approach the widening is given up over, so the ribbon is
    # already narrow when it reaches the deck. 15 m against a 10 m station
    # spacing (deck.resample_m) puts one or two stations inside the blend. At
    # 0 the carriageway edge and its kerb jog ~1.9 m sideways in one station on
    # a two-lane street, which reads as a modelling error rather than as a
    # bridge; much beyond 20 m and the narrowing starts before anything on the
    # ground explains it.
    structure_taper_m: 15.0

    # Low and mountable by design. The lip also gives the carriageway a visible
    # edge, which matters more here than usual: the terrain is too expensive to
    # ship, so beyond the kerb there is nothing at all.
    kerb_height_m: 0.15
    kerb_width_m: 0.5

    # Each ribbon stops this many of the widest half-width meeting at a node,
    # and a cap fills the middle. One half-width clears the junction; the
    # fraction stops a short link between two wide roads being eaten from both
    # ends — 104 of the region's 797 edges are shorter than twice their own
    # junction radius.
    junction_trim_factor: 1.0
    junction_trim_max_fraction: 0.35

    # docs/ART_DESIGN.md: HK asphalt reads warm, not blue-grey. The kerb is the
    # pale concrete that edges every street on the island.
    #
    # ⚠️ **Named from the same table as every other colour, and that is the whole
    # point.** These two were authored here, in their own section, which is how
    # `235aa4f` re-exposed the rest of the palette and left them behind — the
    # section was not in the diff. Referencing the table means there is no longer
    # a second place to forget. The argument for what each one is, and the
    # 2.5:1 concrete-to-asphalt ratio the rule recovered, sits with them under
    # `materials:` at the top of this file.
    surface_material: asphalt_aged
    kerb_material: concrete_kerb

  # Where game y=0 sits for a road deck (Q11). `terrain` samples the LandsD
  # ground mesh under each vertex, which is the only source that knows Wan
  # Chai's ground is ~4 m above the datum rather than at it. `datum` puts
  # every level-0 road at y=0, and is right only for a city whose sources
  # carry no height field.
  ground: terrain

  # How Q24 follows the ground along an at-grade road, rather than sampling it
  # only where `simplify_tolerance_m` happened to leave a vertex.
  #
  # The defect this closes: simplify keeps the vertices a centreline needs *in
  # plan* — 3,553 of 175,610 here, 2.0% — and the terrain was sampled only at
  # those. Between two of them the road is a straight chord over ground that
  # curves, so on a crest the ground rises through it. Cosmetic until P3-10 drew
  # and collided that ground; solid geometry in legal carriageway since.
  #
  # Optional, and requires `ground: terrain` for the obvious reason. Omit the
  # block and the road is sampled at its plan vertices, which is what shipped
  # while there was no drawn ground to disagree with.
  ground_profile:
    # Station spacing before sampling, as deck.resample_m below and for the same
    # reason: the justification is the worst vertex gap, not the typical one.
    resample_m: 10.0

    # Vertical error a station must beat to be kept.
    #
    # Measured over the 721 level-0 edges wholly at grade, as the share of
    # carriageway sitting under ground more than the 0.20 m sink proud of it:
    #
    #   today (no resample)         3,123 stations   1.797%
    #   10 m, no thinning           6,222 (1.99x)    0.107%
    #   10 m, thinned at 0.20       3,244 (1.04x)    0.175%
    #   10 m, thinned at 0.10       3,506 (1.12x)    0.110%
    #   10 m, thinned at 0.05       3,851 (1.23x)    0.107%
    #
    # So thinning buys what full densification buys for an eighth of the
    # stations: most of Wan Chai is flat and needs no extra vertex, and the
    # tolerance is what spends them where the ground actually bends. 0.10 is
    # half the sink, so a station kept at this tolerance cannot poke through on
    # its own. Zero keeps every inserted station.
    #
    # The residual 0.107% is not reachable from here at any spacing: it is the
    # tunnel portals, where a level-0 road descends into a void that has no
    # geometry to sample. See Q21.
    tolerance_m: 0.10

  # How P2-7 takes an off-grade carriageway's height from the structure it is
  # built on, rather than from the flat `elevation_levels` offset. Q20 measured
  # what that offset costs: the ribbon misses the real deck by |error| p90
  # 4.19 m, and sits *below* it — inside the structure — in 66% of samples.
  #
  # Optional, and requires `ground: terrain` — both the gate and the fallback
  # below are measured against the ground mesh. Omit the block and every level
  # keeps its constant offset, which is all a city with no structure class can
  # do anyway.
  deck:
    # Station spacing along an edge before sampling. Off-grade vertex spacing is
    # median 10.8 m but max 446.2 m, and sampling at today's vertices alone
    # already clears the p90 criterion — so this is justified by the *maximum*,
    # not the p90: one 71.5 m gap on FLEMING ROAD spans structure climbing
    # 4.25 to 5.05 m, which is the defect the P2-5 drive found. Resampling first
    # takes the worst error from 4.84 m to under a metre.
    #
    # It costs the region's level-1 edges 430 vertices to 825. That is dearer
    # than the 667 the probe predicted, because the shipped `resample` inserts
    # stations *between* the source's own vertices rather than replacing them
    # with an evenly spaced set — the probe's version was cheaper and quietly
    # cut every corner it landed on.
    resample_m: 10.0

    # Two hits further apart than this are different structures rather than the
    # two faces of one deck. Measured across the region's covered level-1
    # stations: within one deck 0.00-2.57 m, between stacked structures
    # 3.36-8.49 m. A 0.79 m margin — narrow, so it is a tuning value and not a
    # constant, and a city whose decks are thicker will have to move it.
    slab_gap_m: 3.0

    # How far under the ground a sample may sit and still be a deck.
    #
    # Deliberately not a *minimum clearance*: level-1 ramps genuinely touch
    # down, so 33 of the region's 645 covered stations sit within a metre above
    # terrain and no positive threshold could tell a ramp end from a bad sample.
    # What separates is the other side. INFRASTRUCTURE is not only elevated
    # decks — ISLAND EASTERN CORRIDOR (e425, a 25 m stub at the region's
    # north-east corner) samples structure at -8.31 and -8.18 m below terrain,
    # and the next-lowest value anywhere in the region is -0.54 m. One metre
    # sits in that 7.64 m gap and rejects exactly those two stations, which
    # leaves e425 with no valid sample and so wholly on the fallback.
    max_below_terrain_m: 1.0

    # Where the lift of a level-0 edge that starts on a ramp stops: a structure
    # top this close to the ground is the ground.
    #
    # A tolerance rather than a boundary, and it is worth saying so — the 143
    # non-zero lifts across the region's 16 such edge ends run continuously from
    # 0.004 m up, with no gap to sit in. So it is bounded by consequence
    # instead: this value *is* the residual step the lift leaves behind, so it
    # must stay well inside P2-7's 0.5 m acceptance, and it must clear the
    # 0.1-0.2 m sampling wobble that makes those profiles non-monotone. Across
    # 0.1-0.3 the run length moves by at most one 5 m station on 13 of the 16
    # ends; at 0.5 one of them loses its lift entirely, and at 1.0 three do.
    at_grade_m: 0.30

    # The steepest a touchdown may be reconstructed at (Q90). INFRASTRUCTURE
    # stops being modelled where a ramp reaches grade, so the last stretch of
    # every touchdown is uncovered; the ribbon is ramped from the node's
    # at-grade height to the first covered station instead of being held level
    # in the air, and this is where that stops being a ramp.
    #
    # Bounded by the two populations, which are far apart. The six touchdowns
    # this reconstructs run 1.9-6.1%, and opposed carriageways of one flyover
    # agree with each other to within a point: FLEMING ROAD 5.3/6.1, HUNG HING
    # ROAD FLYOVER 2.2/1.9. The worst refusal is MARSH ROAD's e248 at 24.8%,
    # which is 0.66 m over a 1.9 m hole and no road ramps at that.
    #
    # Ten leaves a 4x margin over the steepest keep and refuses the defect by
    # 2.5x, so anything from 8 to 15 gives this region the same answer. That
    # makes it a classifier and not a tuning value - but it is still a
    # statement about what a road can climb, so it is a city's to declare and
    # not a constant in code. Hong Kong's own steepest public roads are around
    # 20%, which is the other reason 10 is not close to a real ramp here.
    touchdown_max_grade_pct: 10.0

    # How far above the sampled structure the carriageway is drawn, which is the
    # layer a real road actually is: a wearing course on a structural deck.
    #
    # Its size, though, is set by something else. P2-7 landed the ribbon on the
    # deck to a median of 0.00 m against the *source* sheets — and the user's
    # review drive then found the shipped ramp visibly sawtoothed, because P2-1
    # decimates INFRASTRUCTURE on a 0.5 m cell and that collapse lifts the deck
    # a median 0.04 m, p99 0.16 m and max 0.34 m above where it was sampled.
    # Two coincident surfaces interleave: white deck through dark carriageway,
    # and wheels riding whichever collider happens to be higher.
    #
    # 0.20 leaves 0.37% of stations still poking through at LOD0 and 5.4% at
    # LOD1. 0.15 leaves 1.31%, still visible in patches; 0.25 removes it but
    # reads as a step up onto the deck. Thicker than a real wearing course at
    # 5-10 cm, and that is the decimation's doing rather than a modelling
    # choice — a finer LOD0 cell would let this come back down.
    clearance_m: 0.20

    # Q19's lateral probe: how far either side of the centreline to look for a
    # wall standing at bumper height. The four values below answer "is this
    # carriageway bounded by structure", which is a different question from
    # every value above it — those all ask how HIGH the road sits.
    #
    # 6.5 is half the widest floor the surface stage can draw (12.48 at 70 kph)
    # plus a little. A shorter reach cannot see the wall the widest ribbon runs
    # into, which is the whole population this exists for; a longer one starts
    # finding the far side of the next street.
    #
    # ⚠️ Deliberately NOT read from surface.floor_by_min_speed_limit_kph, even
    # though that is where 12.48 comes from. The road stage publishes
    # roadgraph.json and the surface stage consumes it, so reaching up for the
    # floor would invert the dependency — and it would make a fact about the
    # road ("there is a wall here") change when a playability value moved.
    bound_reach_m: 6.5

    # Probe spacing across the carriageway.
    #
    # 🔴 A resolution constant in the sense Q51 means, and it does NOT converge —
    # so the published count is a LOWER BOUND at this step and no finer, exactly
    # as Q19's own 26 is a bound at a 1.00 m occupier bin. Swept over the region:
    #
    #   step   1.0     0.5     0.25    0.125   0.0625
    #   bound  285     384     426     439     453   stations
    #
    # It is still climbing at 0.0625 and there is no plateau to sit on, because a
    # finer step keeps landing on narrower slivers of wall. 0.25 is the knee
    # rather than a convergence: halving to it gains 11%, halving again gains 3%.
    # ⚠️ Do not quote a bounded count without this step beside it, and do not
    # read a rise on a finer step as more wall — it is more of the same wall.
    bound_step_m: 0.25

    # The band above the ribbon a structure top must fall in to count as a wall.
    #
    # 0.30 is the low bound and it is load-bearing. Q23 refused a narrowing on
    # exactly this population — "a street on an abutment is a street" — and an
    # abutment the road rests ON answers this probe at the ribbon's own height.
    # Everything at or under 0.30 is that case. It is the same figure as
    # carriageway_occupancy.py's BUMPER_LOW_M and for the same reason, but the
    # two are independent: that tool grades the shipped bundle and this decides
    # what to build, so pinning one to the other would let the grader agree with
    # the pipeline by construction.
    bound_low_m: 0.30

    # 2.50 is the high bound. Measured at the binding station of every blocked
    # INFRASTRUCTURE edge, the wall tops 1.5-2.0 m above the ribbon. A flyover
    # crossing overhead answers with its DECK top — sample_lowest_above returns
    # a slab top, not a soffit — at 5 m or more, so the gap between the two
    # populations is wide and 2.50 sits in it.
    #
    # ⚠️ Raising this past a storey narrows every ordinary street that passes
    # under a viaduct, and that defect renders perfectly: Gloucester Road would
    # simply be drawn narrow under Canal Road Flyover with every counter closing.
    bound_high_m: 2.50

# How P1-5 turns published taxi points into fare nodes.
fares:
  # Furthest a source point may sit from a road centreline and still be
  # attached to it. These are kerbside positions and the graph is centrelines,
  # so the true distance is about half a carriageway: measured across the
  # region's 29 points, 1.18-8.37 m. Thirty metres is far enough to catch a
  # point in a car park or on a pier without rejecting anything real.
  max_snap_m: 30.0

  # Same sentinel as `roads.null_values` — the same department publishes both —
  # but declared separately so the two sections stay independent. Neither taxi
  # dataset actually uses it today; every name is populated in both languages.
  null_values: ["-99"]

  groups:
    - kind: taxi_stand
      source: taxi_stands
      # Both datasets are GeoJSON with no `crs` member, which is CRS84 per
      # RFC 7946 — WGS84 lon/lat, like the buildings sheet index.
      crs: EPSG:4326
      fields:
        name_en: Location_EN
        name_zh: Location_TC
        category: Status_EN

      # ⚠️ ORDER IS LOAD-BEARING. Matching is first-hit-wins over substrings,
      # because `Status_EN` is free text carrying an operating-time note after
      # a newline — "Cross Harbour Taxi Stand\n(1200-0600 daily)". The city's
      # sixteen distinct spellings are surveyed in docs/DATA_SOURCES.md; these
      # five rules cover all of them. The loader refuses a rule an earlier one
      # would always shadow, so a bad reordering fails rather than mis-files.
      #
      # `cross_harbour` is first because it is the one the game cares about —
      # docs/GAME_DESIGN.md makes it the premium fare — and because two of its
      # spellings put the word "Urban" in front of it.
      categories:
        - {match: "Cross Harbour", id: cross_harbour}
        - {match: "Lantau", id: lantau}
        # Catches both "Urban and NT Taxi Stand" and "Both of Urban and NT
        # Taxi Stand". Must precede the bare "NT Taxi Stand" rule below.
        - {match: "Urban and NT", id: urban_and_nt}
        - {match: "NT Taxi Stand", id: nt}
        - {match: "Urban", id: urban}

    - kind: pudo
      source: taxi_pudo
      crs: EPSG:4326
      fields:
        name_en: Location_EN
        name_zh: Location_TC
        category: Status_EN

      # A quarter of the territory's published points — 66 of 275, and 4 of the
      # 15 in this region — are drop-off only. Letting a player hail a fare at
      # one would be wrong in a way a Hong Kong player would notice, so the
      # distinction is carried rather than flattened.
      categories:
        - {match: "PU/DF", id: pickup_dropoff}
        - {match: "DF", id: dropoff, pickup: false}

    # Tram stops (`P3-14`, `Q58`) — the `poi` kind the data contract has always
    # listed and nothing has ever produced. `config.py` says why that is the
    # right home: "a city that adds hotels or malls adds a group rather than a
    # code path", and this is the first thing to take it up on that.
    #
    # ⚠️ **No `name_en` / `name_zh`, because the source has none.** TD publishes
    # `OBJECTID`, `STOP_ID` and a revision date and nothing else — verified
    # against all 117 territory-wide features, of which 19 fall in region. The
    # names are optional roles for exactly this case; pointing them at
    # `STOP_ID` would ship "99101" as a place name.
    #
    # ⚠️ **`pickup` and `dropoff` are both false, and must be stated.**
    # `FareCategory` defaults both to true, which is right for a taxi stand and
    # wrong here: a tram stop is somewhere a *tram* stops. Letting a player hail
    # a fare at one would be wrong in the way docs/GAME_DESIGN.md cares about.
    # What these 19 points are for is `P3-4` — a tram needs somewhere to stop.
    - kind: poi
      source: tram_stops
      crs: EPSG:4326
      fields:
        # The one required role. This source publishes no category either, so
        # it names the field it does have and the single rule below matches
        # everything — an empty `match` is a substring of every string, and the
        # loader refuses any rule placed after one.
        category: STOP_ID
      categories:
        - {match: "", id: tram_stop, pickup: false, dropoff: false}
