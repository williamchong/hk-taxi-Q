[project]
name = "hk-taxi-etl"
version = "0.1.0"
description = "Build-time pipeline turning HK government open geodata into game-ready assets"
requires-python = ">=3.11"
dependencies = [
    "pyproj>=3.6",
    "pyyaml>=6.0",
]

# GDAL/OGR, geopandas and the glTF writers arrive with P1-1. They are heavy and
# platform-awkward, so they stay out until something actually imports them.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `python -m pipeline` is the documented entry point and runs from this
# directory, so tests import the same way rather than depending on an install.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
