[project]
name = "hk-taxi-etl"
version = "0.1.0"
description = "Build-time pipeline turning HK government open geodata into game-ready assets"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pyogrio>=0.10",
    "pypdfium2>=4.30",
    "pyproj>=3.6",
    "pyyaml>=6.0",
]

# `pyogrio` is the GDAL/OGR dependency P1-3 said would arrive. It ships GDAL in
# its own wheels, which is what makes it installable without a system GDAL — the
# platform-awkwardness that got this deferred out of P0-4 in the first place.
# geopandas was not needed: `pipeline/gdb.py` wants coordinate arrays, and going
# via GeoDataFrames would add pandas to reach the same numpy underneath.
#
# No glTF library: P1-2 reads and writes the format directly (`pipeline/gltf.py`
# explains why a dependency would have saved no work).
#
# ---- the two P3-20 added, and what they cost ----
#
# 🔴 **`pillow` moved up from `dev`, and the claim it used to carry — "the core
# pipeline stays image-free" — is no longer true.** `Q63` decided that on
# purpose: the bundle carries a texture now, so the pipeline encodes an image.
# Recorded here rather than quietly deleted, because that sentence was the reason
# the dependency was allowed to be dev-only in the first place.
#
# `pypdfium2` renders the TS Index Plan sheets. It is the `pyogrio` argument
# restated: a self-contained binary wheel that needs no system install, which is
# what keeps the build one `pip install` on a fresh machine. ⚠️ **The alternative
# was `mutool` + `rsvg-convert` + `poppler`**, which is what
# `~/hk-traffic-sign-map` uses and which would have put three brew packages on
# the critical path of every build.
#
# ⚠️ **`sign_sheets.load_sheet` renders with `rev_byteorder=True`, which is NOT
# a declared parameter of `PdfPage.render`** — it reaches the bitmap through
# `render(**kwargs)` and on into `PdfBitmap.new_native`. So the kwarg travels
# through a passthrough, and a release that renames it fails loudly where one
# that changes the bitmap's FORMAT does not. `tests/test_sign_sheets.py` is what
# catches the second, and it only runs where the dataspec has been fetched.
# ✅ **The `>=4.30` floor was checked rather than assumed, and it holds**: 4.30.0
# has the same `render()` signature and both converters, and decodes this
# region's sheets to bytes identical to 5.13.0's. No ceiling, because the thing
# that would justify one is what the test above already watches for.
#
# 🔴 **`pdfminer.six` WAS declared here and nothing ever imported it** (removed
# `Q67`). The comment it carried described a design that was not built: it was to
# read the sheets' ruling lines as vector coordinates in PDF points, and
# `pipeline/sign_sheets.py` recovers the same grid off the rendered raster
# instead. That is not a shortcut — the raster route reuses a render the atlas
# and the survey both need anyway, and it *checks itself*, because a detected
# grid has to multiply out to the span in the sheet's own filename. Exact
# coordinates would not have proved the row belonged to the code being read.
#
# ⚠️ **The sheets are vector, not scanned** — `pdffonts` is empty but the ruling
# lines and glyphs are paths — which is why a 12x render of a cell is crisp
# enough to measure a ring thickness to a thousandth. `Q64` records where the
# "scanned" claim came from. ⚠️ **No OCR anywhere**: `Q65` cut the atlas to cells
# you can name, so nothing needs to read the printed No. column, and
# `tools/sign_atlas_survey.py` — which would have needed `tesseract` — was never
# built and is not owed.
[project.optional-dependencies]
# gdtoolkit formats GDScript, which has nothing to do with the ETL. It lives
# here because this is the repo's only Python manifest, the same reason the
# root ruff.toml extends this file. <5 is ordinary major-version protection: it
# is a third-party reimplementation of the GDScript grammar by a single
# maintainer, so a major bump is likelier than most to change formatting under
# us. Only `gdformat` is wired into the checks; see docs/ARCHITECTURE.md
# "GDScript formatting" for what was left out and why.
#
# Pillow decodes the PNGs `tools/frame_stats.py` grades, and — since the P3-6
# amendment — the photo atlases `pipeline/landmarks.py` samples when a landmark
# opts into `reference_texture`. Still dev-only: the import is lazy behind that
# config flag, so a city with no mesh-sourced hero never touches it. ⚠️ **The
# rest of that sentence used to read "and the core pipeline stays image-free",
# which the `pillow` note above retracts** — `P3-20` moved it into
# `dependencies`. It is *not* a step toward the terrain
# classifier `Q18` defers — that one would put image decoding on every build's
# critical path and into CI, which neither of these does.
dev = [
    "gdtoolkit>=4.5,<5",
    "pillow>=10.0",
    "pytest>=8.0",
    "ruff>=0.6",
]
# ⚠️ **No `survey` extra, and no API client anywhere in this repo** — `Q41`'s
# vision reader was the only caller and went at `Q102`, so re-adding `anthropic`
# is a dependency decision as much as a survey one.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `python -m pipeline` is the documented entry point and runs from this
# directory, so tests import the same way rather than depending on an install.
#
# `../tools` is here so the acceptance-tool tests can import what they grade
# without a `sys.path` insert of their own. The tools live outside the package
# on purpose — they grade the pipeline and must not be importable from it.
pythonpath = [".", "../tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The prime in `Q34′`. It is how this repo names a question reopened by a later
# finding, so it is the identifier a reader greps for across docs and code, and
# RUF002 would otherwise push the two apart by flagging it only in Python.
allowed-confusables = ["′"]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
